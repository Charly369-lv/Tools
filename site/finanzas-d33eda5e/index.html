<script>
"use strict";
const $ = id => document.getElementById(id);
const app = $("app");
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const ssDel = k => { try { sessionStorage.removeItem(k); } catch (e) {} };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => { let s = ""; const a = new Uint8Array(u); for (let i = 0; i < a.length; i += 32768) s += String.fromCharCode.apply(null, a.subarray(i, i + 32768)); return btoa(s); };
const sum = a => a.reduce((x, y) => x + y, 0);

// ================================================================ cifrado (mismo formato que sync/existencias.py)
async function llave(clave, sal, it, uso) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: sal, iterations: it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, [uso]);
}
async function descifrar(sobre, clave) {
  const key = await llave(clave, b64(sobre.s), sobre.it, "decrypt");
  let plano;
  try { plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sobre.iv) }, key, b64(sobre.d)); } catch (e) { throw new Error("clave"); }
  return JSON.parse(await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
async function cifrar(obj, clave) {
  const sal = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), it = 310000;
  const gz = await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
  const key = await llave(clave, sal, it, "encrypt");
  const d = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, gz);
  return { kdf: "PBKDF2-SHA256", it, s: b64e(sal), iv: b64e(iv), d: b64e(d) };
}
async function bajar(url) { const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error("falta"); return r.json(); }

// ================================================================ estado y ajustes
let D = null, ROL = null, CLAVE = null, DEMO = false;
let V = { tab: "resumen", area: "todo", periodo: "12m", vistaProv: "rent", moneda: "USD", prov: null, filtro: "", color: "", orden: ["inv", -1] };
const AJ_DEF = {
  ver: 2, tc: null, modoCosto: "pvp", factPvp: 40, factProv: {}, consig: {}, pctOtro: 25,
  pctPais: { "Guatemala": 0, "México": 20, "Mexico": 20, "España": 25, "Spain": 25, "Argentina": 35, "Estados Unidos": 20, "United States": 20, "Colombia": 30, "China": 35, "India": 35 },
  pctProv: {}, estrategico: {}, entrega: {}, minimo: {},
  umb: { vG: 2, vA: 0.75, aG: 1.2, aA: 1.25, nG: 0.75, nA: 2, muerto: 30 },
  cob: { v: 5, a: 2.5, n: 1.5, r: 0 }, leadOtro: 60,
  leadPais: { "Guatemala": 7, "México": 45, "Mexico": 45, "España": 90, "Spain": 90, "Argentina": 90, "Estados Unidos": 30, "United States": 30, "Colombia": 60, "China": 90, "India": 90 },
};
// datos privados del gerente financiero: nunca van en el archivo de los compradores
const AJF_DEF = { saldo: 0, colchon: 0, credito: 0, quitarIva: true, incluirPedido: true, deudas: [], gastos: {}, corp: {} };
let AJF = JSON.parse(JSON.stringify(AJF_DEF));
let AJ = JSON.parse(JSON.stringify(AJ_DEF));
function mezclar(base, extra) {
  const o = JSON.parse(JSON.stringify(base));
  for (const k in extra || {}) o[k] = (o[k] && typeof o[k] === "object" && !Array.isArray(o[k])) ? Object.assign(o[k], extra[k]) : extra[k];
  return o;
}

const tc = () => Number(AJ.tc) || (D && D.tc) || 7.7;
const dinero = (q, dec) => {
  const v = V.moneda === "USD" ? q / tc() : q;
  const s = V.moneda === "USD" ? "$" : "Q";
  const a = Math.abs(v), sig = v < 0 ? "−" : "";
  if (!dec && a >= 1e6) return sig + s + (a / 1e6).toLocaleString("es-GT", { maximumFractionDigits: 2 }) + " M";
  if (!dec && a >= 1e4) return sig + s + Math.round(a / 1e3).toLocaleString("es-GT") + " mil";
  return sig + s + a.toLocaleString("es-GT", { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 });
};
const num = (n, d) => Number(n || 0).toLocaleString("es-GT", { maximumFractionDigits: d == null ? 0 : d, minimumFractionDigits: d || 0 });
const pct = n => isFinite(n) ? num(n * 100, 0) + " %" : "—";
const anios = n => !isFinite(n) ? "sin venta" : n >= 10 ? "10+ años" : num(n, 1) + (n === 1 ? " año" : " años");
const veces = n => !isFinite(n) ? "—" : num(n, 2);

// ================================================================ cálculos
const COLORES = { v: "#1f9d55", a: "#d4a017", n: "#e07020", r: "#d33a2c" };
const NOMBRE = { v: "Invertir", a: "Mantener", n: "Reducir", r: "No comprar" };
let CALC = null;

function esLibro(cat) { return /LIBRO/.test(cat) && !/VARIOS/.test(cat); }
function enArea(ci) {
  const c = D.cats[ci] || "";
  if (/INTERNO/.test(c)) return V.area === "todo" ? false : V.area === "c" + ci;
  if (V.area === "todo") return true;
  if (V.area === "libros") return esLibro(c);
  if (V.area === "merc") return !esLibro(c);
  return V.area === "c" + ci;
}
function pctDe(pi) {
  const p = D.prov[pi];
  if (AJ.pctProv[p.n] != null && AJ.pctProv[p.n] !== "") return Number(AJ.pctProv[p.n]) / 100;
  const ps = AJ.pctPais[p.pais];
  return (ps != null ? Number(ps) : Number(AJ.pctOtro)) / 100;
}
function factDe(pi) { const n = D.prov[pi].n; return (AJ.factProv[n] != null && AJ.factProv[n] !== "" ? Number(AJ.factProv[n]) : Number(AJ.factPvp) || 40) / 100; }
const esConsig = pi => !!AJ.consig[D.prov[pi].n];
function costoUnit(r, pi) {
  if (AJ.modoCosto === "pvp") return (r[5] || 0) * factDe(pi);
  if (AJ.modoCosto === "odoo") return r[6] || 0;
  const base = r[7] > 0 ? r[7] : r[6];
  return base * (1 + pctDe(pi));
}
function semaforo(g, a, m, inv, v12) {
  const U = AJ.umb;
  if (inv <= 0 && v12 <= 0) return null;
  if (v12 <= 0) return "r";
  if (g < U.nG || a > U.nA || m * 100 > U.muerto) return "r";
  if (g < U.aG || a > U.aA) return "n";
  if (g >= U.vG && a < U.vA) return "v";
  return "a";
}

function periodos() {
  const anios = [...new Set(D.meses.map(m => m.slice(0, 4)))].filter(a => D.meses.filter(m => m.startsWith(a)).length >= 3);
  return [["12m", "Últimos 12 meses"]].concat(anios.reverse().map(a => { const k = D.meses.filter(m => m.startsWith(a)).length; return [a, a + (k < 12 ? ` (${k} meses)` : "")]; }));
}
function periodo() {
  const n = D.meses.length;
  let idx, prev;
  if (V.periodo === "12m" || !D.meses.some(m => m.startsWith(V.periodo))) { idx = [...Array(Math.min(12, n)).keys()].map(i => n - Math.min(12, n) + i); prev = idx.map(i => i - 12).filter(i => i >= 0); }
  else { idx = D.meses.map((m, i) => m.startsWith(V.periodo) ? i : -1).filter(i => i >= 0); prev = idx.map(i => i - 12).filter(i => i >= 0); }
  const nombre = V.periodo === "12m" ? "los últimos 12 meses" : V.periodo + (idx.length < 12 ? ` (${idx.length} meses)` : "");
  return { idx, prev: prev.length === idx.length ? prev : [], nm: idx.length, anual: 12 / idx.length, nombre };
}
function calcular() {
  const n = D.meses.length, i12 = n - 12, PER = periodo(), enP = new Set(PER.idx), enPrev = new Set(PER.prev);
  const P = D.prov.map((p, i) => ({ i, n: p.n, pais: p.pais, v12: 0, v12p: 0, u12: 0, cv12: 0, inv: 0, invN: 0, ex: 0, invpvp: 0, muerto: 0, unidades: 0, prods: 0, consig: esConsig(i),
    vm: new Array(n).fill(0), cvm: new Array(n).fill(0), co: p.co || new Array(n).fill(0), cats: {} }));
  const T = { v12: 0, cv12: 0, inv: 0, muerto: 0, v12p: 0 };
  for (const r of D.prod) {
    if (!enArea(r[4])) continue;
    const p = P[r[3]], cu = costoUnit(r, r[3]), vu = r[9], vq = r[10];
    let u12 = 0, q12 = 0, q12p = 0, uU = 0;
    for (let k = 0; k < n; k++) {
      if (enP.has(k)) { u12 += vu[k]; q12 += vq[k]; } else if (enPrev.has(k)) q12p += vq[k];
      if (k >= i12) uU += vu[k];
      p.vm[k] += vq[k]; p.cvm[k] += vu[k] * cu;
    }
    const ex = Math.max(0, r[8]), invN = ex * cu, inv = p.consig ? 0 : invN;
    const muerto = ex > 0 && uU <= 0 && (r[11] || "0") <= D.meses[i12] ? inv : 0;
    p.v12 += q12; p.v12p += q12p; p.u12 += u12; p.cv12 += u12 * cu; p.inv += inv; p.invN += invN; p.ex += ex; p.invpvp += ex * (r[5] || 0); p.muerto += muerto; p.prods++;
    p.cats[r[4]] = (p.cats[r[4]] || 0) + q12 + inv;
    T.v12 += q12; T.v12p += q12p; T.cv12 += u12 * cu; T.inv += inv; T.muerto += muerto;
  }
  const lista = [];
  for (const p of P) {
    if (!p.prods) continue;
    p.mg = p.v12 - p.cv12;
    p.mgp = p.v12 > 0 ? p.mg / p.v12 : NaN;
    p.g = p.consig ? NaN : p.inv > 0 ? p.mg * PER.anual / p.inv : (p.mg > 0 ? 99 : 0);
    p.a = p.cv12 > 0 ? p.invN / (p.cv12 * PER.anual) : (p.invN > 0 ? Infinity : 0);
    p.aU = p.u12 > 0 ? p.ex / (p.u12 * PER.anual) : (p.ex > 0 ? Infinity : 0);
    p.m = p.inv > 0 ? p.muerto / p.inv : 0;
    p.c12 = PER.idx.reduce((s, k) => s + (p.co[k] || 0), 0) * (1 + pctDe(p.i));
    p.gan = p.v12 - p.c12;
    p.crec = p.v12p > 0 ? p.v12 / p.v12p - 1 : NaN;
    p.s = p.consig ? (p.v12 <= 0 && p.invN <= 0 ? null : p.a > AJ.umb.nA ? "n" : "v") : semaforo(p.g, p.a, p.m, p.inv, p.v12);
    p.est = AJ.estrategico[p.n] || "";
    if (p.s) lista.push(p);
  }
  T.mg = T.v12 - T.cv12; T.g = T.inv > 0 ? T.mg * PER.anual / T.inv : 0; T.a = T.cv12 > 0 ? T.inv / (T.cv12 * PER.anual) : 0;
  T.c12 = sum(lista.map(p => p.c12));
  CALC = { P, lista, T, PER };
}

function razones(p) {
  const U = AJ.umb, out = [];
  if (p.consig) out.push(`<b>Consignación:</b> su inventario no es dinero de la empresa. Margen en ${CALC.PER.nombre}: ${dinero(p.mg)}; ${anios(p.a)} de inventario${p.a > U.nA ? ", ocupa espacio que podría usar otro proveedor" : ""}.`);
  else if (p.v12 <= 0) out.push(`No vendió nada en ${CALC.PER.nombre} y tiene ${dinero(p.inv)} en inventario.`);
  else if (!p.consig) {
    out.push(`<b>GMROI ${veces(p.g)}:</b> cada ${V.moneda === "USD" ? "$" : "Q"}1 invertido en su inventario deja ${V.moneda === "USD" ? "$" : "Q"}${num(p.g, 2)} de margen al año ${p.g < U.nG ? "(menos de lo invertido)" : p.g >= U.vG ? "(muy bueno)" : ""}.`);
    out.push(`<b>${anios(p.a)} de inventario:</b> es lo que tardaría en venderse lo que ya hay, al ritmo actual${p.a > U.nA ? ". Es demasiado" : ""}.`);
  }
  if (p.m > 0.05) out.push(`<b>${pct(p.m)} del inventario está muerto</b> (sin una sola venta en 12 meses): ${dinero(p.muerto)} que se pueden liquidar.`);
  if (!p.consig && p.c12 > p.cv12 * 1.15 && p.cv12 > 0) out.push(`En ${CALC.PER.nombre} se le compró ${dinero(p.c12)} pero solo se vendió ${dinero(p.cv12)} a costo: <b>el inventario sigue creciendo</b>.`);
  return out;
}

function abrirFicha(i) { V.prov = i; V.tab = "ficha"; pintar(); window.scrollTo({ top: 0 }); }
const semHtml = p => p.consig ? `<span class="sem e">Consignación</span>${p.s === "n" ? ' <span class="sem n">Rota lento</span>' : ""}` : p.est ? `<span class="sem e" title="${esc(p.est)}">Estratégico</span> <span class="sem ${p.s}">${NOMBRE[p.s]}</span>` : `<span class="sem ${p.s}">${NOMBRE[p.s]}</span>`;

function vResumen() {

  const crec = T.v12p > 0 ? T.v12 / T.v12p - 1 : NaN;
  const trap = lista.filter(p => p.s === "r" || p.s === "n").sort((a, b) => b.inv - a.inv).slice(0, 10);
  const top = lista.slice().sort((a, b) => b.mg - a.mg).slice(0, 10);

      <div class="kpi"><span>Inventario a costo</span><b>${dinero(T.inv)}</b><small>${anios(T.a)} de venta</small></div>
      <div class="kpi ${T.g >= AJ.umb.aG ? "bien" : T.g < AJ.umb.nG ? "alerta" : ""}"><span>GMROI de la empresa</span><b>${veces(T.g)}</b><small>margen anual por cada 1 en inventario</small></div>

  </div>`;
  v.querySelectorAll("[data-p]").forEach(li => li.onclick = () => abrirFicha(+li.dataset.p));

function mapa(el, lista) {
  const pts = lista.filter(p => p.inv > 0).sort((a, b) => b.inv - a.inv).slice(0, 80);
  const W = 1000, H = 460, L = 60, R = 44, Tp = 20, B = 50;
  const XM = 4, YM = 8;
  const x = a => L + Math.min(isFinite(a) ? a : XM, XM) / XM * (W - L - R);
  const y = g => Tp + (1 - Math.max(0, Math.min(g, YM)) / YM) * (H - Tp - B);
  const maxI = Math.max(1, ...pts.map(p => p.inv));
  const rr = i => 5 + Math.sqrt(i / maxI) * 32;
  const U = AJ.umb;
  let s = `<svg class="mapa" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Mapa de proveedores: años de inventario contra GMROI">`;
  s += `<rect x="${x(0)}" y="${y(YM)}" width="${x(U.vA) - x(0)}" height="${y(U.vG) - y(YM)}" fill="${COLORES.v}" opacity=".08"/>`;
  s += `<rect x="${x(U.nA)}" y="${y(YM)}" width="${x(XM) - x(U.nA)}" height="${y(0) - y(YM)}" fill="${COLORES.r}" opacity=".06"/>`;
  s += `<rect x="${x(0)}" y="${y(U.nG)}" width="${x(U.nA) - x(0)}" height="${y(0) - y(U.nG)}" fill="${COLORES.r}" opacity=".06"/>`;
  for (let g = 0; g <= YM; g += 2) s += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(g) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${g}${g === YM ? "+" : ""}</text>`;
  for (let a = 0; a <= XM; a += 0.5) s += `<text x="${x(a)}" y="${H - B + 18}" text-anchor="middle" font-size="12" fill="var(--muted)">${a}${a === XM ? "+" : ""}</text>`;
  s += `<line x1="${x(U.nA)}" x2="${x(U.nA)}" y1="${Tp}" y2="${H - B}" stroke="${COLORES.r}" stroke-dasharray="4 4"/>`;
  s += `<line x1="${L}" x2="${W - R}" y1="${y(U.nG)}" y2="${y(U.nG)}" stroke="${COLORES.r}" stroke-dasharray="4 4"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">Años de inventario (cuánto tarda en venderse lo que hay) →</text>`;
  s += `<text transform="translate(16 ${(Tp + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="var(--muted)">GMROI (margen por cada 1 invertido) →</text>`;
  s += `<text x="${x(0) + 8}" y="${y(YM) + 18}" font-size="12" font-weight="800" fill="${COLORES.v}">INVERTIR</text>`;
  s += `<text x="${W - R - 8}" y="${y(YM) + 18}" text-anchor="end" font-size="12" font-weight="800" fill="${COLORES.r}">DINERO PARADO</text>`;
  for (const p of pts) s += `<circle tabindex="0" data-p="${p.i}" cx="${x(p.a)}" cy="${y(p.g)}" r="${rr(p.inv)}" fill="${COLORES[p.s]}"><title>${esc(p.n)}</title></circle>`;
  s += "</svg>";
  el.innerHTML = s;
  const tip = $("tip");
  el.querySelectorAll("circle").forEach(c => {
    const p = CALC.P[+c.dataset.p];
    c.onmousemove = e => { tip.hidden = false; tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + "px"; tip.style.top = (e.clientY + 14) + "px";
      tip.innerHTML = `<b>${esc(p.n)}</b><br>${NOMBRE[p.s]}${p.est ? ", estratégico" : ""}<br>Inventario ${dinero(p.inv)}, ${anios(p.a)}<br>GMROI ${veces(p.g)}, margen ${pct(p.mgp)}`; };
    c.onmouseleave = () => { tip.hidden = true; };
    c.onclick = () => { tip.hidden = true; abrirFicha(p.i); };
    c.onkeydown = e => { if (e.key === "Enter") abrirFicha(p.i); };
  });
}

function prodsDe(pi) {
  const PER = periodo(), out = [];
  for (const r of D.prod) {
    if (r[3] !== pi || !enArea(r[4])) continue;
    const cu = costoUnit(r, pi), u12 = PER.idx.reduce((s, k) => s + r[9][k], 0), q12 = PER.idx.reduce((s, k) => s + r[10][k], 0), ex = Math.max(0, r[8]);
    out.push({ c: r[1], n: r[2], cat: D.cats[r[4]], pvp: r[5], cu, u12, q12, mg: q12 - u12 * cu, ex, inv: ex * cu,
      ult: r[12] >= 0 ? D.meses[r[12]] : "", meses: u12 > 0 ? ex / (u12 / PER.nm) : Infinity, alta: r[11] });
  }
  return out;
}
function vFicha() {

function grafica(el, p) {
  const n = D.meses.length, W = 1000, H = 260, L = 60, B = 34, Tp = 14;
  const max = Math.max(1, ...p.co, ...p.cvm);
  const bw = (W - L - 10) / n;
  const y = v => Tp + (1 - v / max) * (H - Tp - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Compras y vendido a costo por mes">`;
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; s += `<line x1="${L}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${dinero(v)}</text>`; }
  D.meses.forEach((m, k) => {
    const x0 = L + k * bw;
    s += `<rect x="${x0 + bw * 0.12}" y="${y(p.co[k])}" width="${bw * 0.36}" height="${y(0) - y(p.co[k])}" fill="var(--navy)" rx="2"><title>${m}: compras ${dinero(p.co[k])}</title></rect>`;
    s += `<rect x="${x0 + bw * 0.5}" y="${y(p.cvm[k])}" width="${bw * 0.36}" height="${y(0) - y(p.cvm[k])}" fill="${COLORES.v}" rx="2"><title>${m}: vendido a costo ${dinero(p.cvm[k])}</title></rect>`;
    if (k % 3 === 0) s += `<text x="${x0 + bw / 2}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--muted)">${m.slice(5)}/${m.slice(2, 4)}</text>`;
  });
  el.innerHTML = s + "</svg>";
}

// ================================================================ utilidades de fechas y estacionalidad
const HOY = new Date(); HOY.setHours(0, 0, 0, 0);
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const masDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + Math.round(n)); return x; };
const deIso = s => { const d = s ? new Date(s + "T00:00:00") : new Date(HOY); return isNaN(d) ? new Date(HOY) : d; };
const MES_N = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fCorta = d => d.getDate() + " " + MES_N[d.getMonth()];
const fMes = d => MES_N[d.getMonth()] + " " + String(d.getFullYear()).slice(2);
const diasMes = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
function indices() {
  if (D._idx) return D._idx;
  const tot = new Array(12).fill(0), cnt = new Array(12).fill(0), n = D.meses.length;
  const porMes = new Array(n).fill(0);
  for (const r of D.prod) for (let k = 0; k < n; k++) porMes[k] += r[9][k];
  for (let k = 0; k < n - 1; k++) { const cm = +D.meses[k].slice(5) - 1; tot[cm] += porMes[k]; cnt[cm]++; }
  const prom = tot.map((t, i) => cnt[i] ? t / cnt[i] : 0), media = sum(prom) / (prom.filter(x => x > 0).length || 1);
  D._idx = prom.map(x => media > 0 && x > 0 ? x / media : 1);
  return D._idx;
}
// unidades que se venden en los próximos `dias` días, con un promedio mensual `base`
function demanda(base, dias) {
  const I = indices(); let t = new Date(HOY), resto = dias, d = 0;
  while (resto > 0) { const dm = diasMes(t), quedan = dm - t.getDate() + 1, toma = Math.min(resto, quedan); d += base * I[t.getMonth()] * toma / dm; resto -= toma; t = new Date(t.getFullYear(), t.getMonth() + 1, 1); }
  return d;
}
// días hasta que se acaben `stock` unidades
function diasHasta(base, stock) {
  if (base <= 0) return 9999;
  const I = indices(); let t = new Date(HOY), dias = 0, queda = stock;
  while (dias < 730) { const dm = diasMes(t), quedan = dm - t.getDate() + 1, diario = base * I[t.getMonth()] / dm;
    if (diario * quedan >= queda) return dias + Math.floor(queda / (diario || 1e-9)); queda -= diario * quedan; dias += quedan; t = new Date(t.getFullYear(), t.getMonth() + 1, 1); }
  return 730;
}

function calcPedido() {
  const n = D.meses.length, i12 = n - 12, out = [];
  const porProv = new Map();
  D.prod.forEach((r, fi) => { if (enArea(r[4])) { if (!porProv.has(r[3])) porProv.set(r[3], []); porProv.get(r[3]).push(fi); } });
  for (const p of CALC.lista) {

// ================================================================ fase 3 · flujo de caja
const TIPOS = [["ventas", "Cobros por ventas", 1], ["oc", "Compras ya colocadas", -1], ["cxp", "Facturas de proveedor", -1], ["pedido", "Pedido sugerido", -1], ["gastos", "Gastos de tiendas y oficinas", -1], ["deudas", "Deudas y compromisos", -1], ["iva", "IVA por pagar (estimado)", -1]];
function calcFlujo(conPedido) {
  const ev = [], fin = masDias(HOY, 372), I = indices(), n = D.meses.length, i12 = n - 12;
  const add = (tipo, fecha, monto, txt) => { if (fecha < HOY && !["oc", "cxp", "pedido"].includes(tipo)) return; let f = fecha < HOY ? new Date(HOY) : fecha; if (f <= fin && monto) ev.push({ tipo, f, m: monto, txt }); };
  let base = 0; for (const r of D.prod) base += sum(r[10].slice(i12)); base /= 12;
  const ventaMes = {}, compraMes = {};
  for (let k = 0; k < 13; k++) {
    const d0 = new Date(HOY.getFullYear(), HOY.getMonth() + k, 1), dm = diasMes(d0), vm = base * I[d0.getMonth()];
    ventaMes[k] = vm;
    for (let dd = 1; dd <= dm; dd += 7) add("ventas", new Date(d0.getFullYear(), d0.getMonth(), dd), vm * Math.min(7, dm - dd + 1) / dm);
    const G = { sueldos: 0, renta: 0, servicios: 0, otros: 0 };
    [...Object.values(AJF.gastos || {}), AJF.corp || {}].forEach(x => RUBROS.forEach(r => G[r[0]] += Number(x[r[0]]) || 0));
    add("gastos", new Date(d0.getFullYear(), d0.getMonth(), 15), G.sueldos / 2, "Sueldos (quincena)");
    add("gastos", new Date(d0.getFullYear(), d0.getMonth(), dm), G.sueldos / 2, "Sueldos (fin de mes)");
    add("gastos", new Date(d0.getFullYear(), d0.getMonth(), 1), G.renta, "Rentas");
    add("gastos", new Date(d0.getFullYear(), d0.getMonth(), 10), G.servicios, "Servicios");
    add("gastos", new Date(d0.getFullYear(), d0.getMonth(), 20), G.otros, "Otros gastos");
  }
  const cred = Number(AJF.credito) || 0;
  for (const [pi, f, m] of D.oc || []) { add("oc", masDias(deIso(f), cred), m, D.prov[pi] ? D.prov[pi].n : ""); }
  for (const [pi, f, m] of D.cxp || []) add("cxp", deIso(f), m, D.prov[pi] ? D.prov[pi].n : "");
  for (const dd of AJF.deudas || []) {
    const cada = { mensual: 1, trimestral: 3, semestral: 6, anual: 12 }[dd.cada] || 0, hasta = dd.hasta ? deIso(dd.hasta) : fin;
    let f = deIso(dd.fecha);
    if (!cada) { add("deudas", f, Number(dd.monto) || 0, dd.c); continue; }
    for (let i = 0; i < 40 && f <= hasta; i++) { add("deudas", f, Number(dd.monto) || 0, dd.c); f = new Date(f.getFullYear(), f.getMonth() + cada, f.getDate()); }
  }
  if (conPedido) for (const x of calcPedido()) if (x.total) {
    add("pedido", masDias(x.fp < HOY ? HOY : x.fp, x.lead + cred), x.total, x.p.n);
    const k = Math.max(0, Math.round((masDias(x.fp < HOY ? HOY : x.fp, x.lead) - HOY) / 2.63e9)); compraMes[k] = (compraMes[k] || 0) + x.total;

function graficaFlujo(el, P, colchon, vista) {
  const W = 1000, H = 260, L = 70, R = 10, Tp = 14, B = 30, n = P.length;
  const vals = P.map(x => x.fin).concat([colchon, P[0].ini]);
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0), rng = (max - min) || 1;
  const y = v => Tp + (max - v) / rng * (H - Tp - B), bw = (W - L - R) / n, x = i => L + i * bw + bw / 2;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Saldo de caja proyectado">`;
  for (let k = 0; k <= 4; k++) { const v = min + rng * k / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${dinero(v)}</text>`; }
  s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  if (colchon) s += `<line x1="${L}" x2="${W - R}" y1="${y(colchon)}" y2="${y(colchon)}" stroke="var(--red)" stroke-dasharray="5 4"/><text x="${W - R}" y="${y(colchon) - 5}" text-anchor="end" font-size="11" font-weight="700" fill="var(--red)">colchón mínimo</text>`;
  P.forEach((p, i) => { const h = Math.abs(y(p.neto) - y(0)); s += `<rect x="${x(i) - bw * 0.3}" y="${p.neto >= 0 ? y(p.neto) : y(0)}" width="${bw * 0.6}" height="${h}" fill="${p.neto >= 0 ? "var(--green)" : "var(--red)"}" opacity=".25"><title>Neto ${dinero(p.neto)}</title></rect>`;
    s += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${vista === "sem" ? fCorta(p.d) : fMes(p.d)}</text>`; });
  s += `<polyline fill="none" stroke="var(--navy)" stroke-width="3" points="${P.map((p, i) => x(i) + "," + y(p.fin)).join(" ")}"/>`;
  P.forEach((p, i) => s += `<circle cx="${x(i)}" cy="${y(p.fin)}" r="4" fill="${p.bajo ? "var(--red)" : "var(--navy)"}"><title>${vista === "sem" ? "Semana del " + fCorta(p.d) : fMes(p.d)}: saldo ${dinero(p.fin)}</title></circle>`);
  el.innerHTML = s + "</svg>";
}

    ["EDICIONES GAMMA", "España", 4, 160, 230, 98, 19, 0.93], ["EDITORIAL DELTA", "México", 4, 300, 140, 58, 9, 1.06], ["LIBRERIA INFANTIL", "Colombia", 4, 220, 120, 52, 12, 1.0],
    ["TAROT Y MISTICA", "España", 4, 80, 220, 90, 16, 1.1], ["COMICS IMPORT", "Estados Unidos", 4, 50, 200, 120, 28, 0.85],
  ];
  const prov = [], prod = [], oc = [], cxp = [];
  let id = 1;
  tipos.forEach((t, pi) => {
    prov.push({ id: pi + 1, n: t[0], pais: t[1], co: new Array(36).fill(0) });
    const nP = 40 + Math.floor(rnd() * 120);
    for (let j = 0; j < nP; j++) {
      const peso = Math.pow(rnd(), 2.2) * 3 / nP * 20;
      const muerto = rnd() < (t[6] > 20 ? 0.35 : 0.08);
      const vu = [], vq = [];
      const precio = Math.round(t[4] * (0.6 + rnd() * 0.9));
      for (let k = 0; k < 36; k++) {
        const temp = [0.8, 0.75, 0.85, 0.9, 0.95, 0.9, 0.95, 1, 0.95, 1.05, 1.25, 1.9][Number(meses[k].slice(5)) - 1];
        const base = muerto ? 0 : t[3] * 9 * peso / 20 * temp * Math.pow(t[7], (k - 24) / 12);
        const u = Math.max(0, Math.round(base * (0.6 + rnd() * 0.8)));
        vu.push(u); vq.push(Math.round(u * precio * 0.93));
      }
      const u12 = sum(vu.slice(-12)) || 1;
      const ex = Math.round((muerto ? 5 + rnd() * 60 : u12 / 12 * t[6] * (0.5 + rnd())));
      const costo = Math.round(precio * t[5] / t[4] * 100) / 100;
      const pc = Math.round(costo / 1.25 * 100) / 100;
      const ult = vu.reduce((m, x, k) => x > 0 ? k : m, -1);
      const cam = !muerto && rnd() < 0.15 ? Math.round(u12 / 12 * (1 + rnd() * 2)) : 0;
      prod.push([id, String(7500000000000 + id), t[0].split(" ")[0] + " PRODUCTO " + (j + 1), pi, t[2], precio, costo, pc, ex, vu, vq, "2022-01", ult, cam]);
      if (cam) oc.push([pi, iso(masDias(HOY, 10 + rnd() * 70)), Math.round(cam * pc * 1.1)]);
      for (let k = 0; k < 36; k++) prov[pi].co[k] += vu[k] * pc * (t[6] > 20 ? 1.6 : 1.05) * (0.4 + rnd() * 1.2);
      id++;
    }
    prov[pi].co = prov[pi].co.map(Math.round);
  });
  const tiendas = [["PRADE", "Galerías La Pradera", 1.4], ["CONCE", "Pradera Concepción", 1], ["ANTIG", "La Antigua Guatemala", 1.2], ["MIRAF", "Miraflores", 1.3], ["PORTA", "Portales", 0.8], ["INTER", "Interplaza Xela", 0.7],
    ["COBAN", "Plaza Magdalena Cobán", 0.45], ["AMERI", "Parque Las Américas", 0.9], ["ZONA1", "Centro Histórico", 0.6], ["SANC", "SanKris Mall", 0.5], ["VIDER", "Vidēre", 0.55], ["MAJAD", "Majadas ONCE", 0.35]];
  const pesoT = tiendas.map(t => t[2]), totP = sum(pesoT), vt = [];
  prod.forEach((r, fi) => { const u12 = sum(r[9].slice(-12)); if (u12 > 0) tiendas.forEach((t, ti) => { const q = Math.round(u12 * 0.85 * pesoT[ti] / totP * (0.7 + rnd() * 0.6)); if (q > 0) vt.push([fi, ti, q]); }); });
  prov.forEach((p, pi) => { const mes = sum(p.co.slice(-12)) / 12; for (let k = 0; k < 3; k++) if (mes > 0) cxp.push([pi, iso(masDias(HOY, -20 + k * 30 + rnd() * 15)), Math.round(mes * (0.5 + rnd() * 0.6))]); });
  const gastos = {}; tiendas.forEach(t => { gastos[t[0]] = { sueldos: Math.round(32000 * (0.6 + t[2] * 0.5)), renta: Math.round(30000 * (0.5 + t[2] * 0.6)), servicios: Math.round(6000 * (0.6 + t[2] * 0.4)), otros: 4000 }; });
  const ajfDemo = { saldo: 3500000, colchon: 1500000, credito: 30, quitarIva: true, incluirPedido: true, gastos, corp: { sueldos: 160000, renta: 45000, servicios: 15000, otros: 25000 },
    deudas: [{ c: "Préstamo bancario (ejemplo)", monto: 180000, cada: "mensual", fecha: iso(masDias(HOY, 12)), hasta: "" }, { c: "Acuerdo de pago proveedor (ejemplo)", monto: 250000, cada: "trimestral", fecha: iso(masDias(HOY, 40)), hasta: "" }, { c: "Bono 14 (ejemplo)", monto: 420000, cada: "anual", fecha: (HOY.getMonth() >= 6 ? HOY.getFullYear() + 1 : HOY.getFullYear()) + "-07-15", hasta: "" }, { c: "Aguinaldo (ejemplo)", monto: 420000, cada: "anual", fecha: (HOY.getMonth() === 11 && HOY.getDate() > 15 ? HOY.getFullYear() + 1 : HOY.getFullYear()) + "-12-15", hasta: "" }] };
  return { generado: "ejemplo", meses, tc: 7.7, prov, cats, prod, tiendas: tiendas.map(t => ({ c: t[0], n: t[1] })), vt, oc, cxp, ajfDemo };
}
