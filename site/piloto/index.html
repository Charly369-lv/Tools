<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Carga el camión escaneando etiqueta y sello de cada caja, y registra cada entrega en tienda.">
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icono-180.png">
<meta name="robots" content="noindex,nofollow">
<title>Pilotos De Museo</title>
<link rel="stylesheet" href="../fuentes/fuentes.css">
<style>
/* Despachos: el CEDIS empaca por caja escaneando cada unidad y sella; la tienda recibe a ciegas y se comparan diferencias */
:root {
  --navy: #112369; --navy-deep: #0b1748; --on-navy: #fff;
  --bg: #f3f4f9; --surface: #fff; --ink: #111a3d; --muted: #5b6386; --line: #d9dcea; --soft: #e9ecf6;
  --red: #c42318; --red-bg: #fde8e6; --amber: #9a6700; --amber-bg: #fff3d1; --green: #157a3d; --green-bg: #e3f4e8; --gold: #f2bd3c;
  --f-display: "Bodoni Moda", Georgia, serif; --f-body: "Archivo", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --navy: #2a40a0; --bg: #080e26; --surface: #111a3d; --ink: #edf0fa; --muted: #9da6c9; --line: #26315e; --soft: #18224c;
    --red: #ff7a6b; --red-bg: #3a1512; --amber: #f2bd3c; --amber-bg: #3a2f10; --green: #4fd383; --green-bg: #10331f; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1100px; margin: 0 auto; }
header.mast { background: var(--navy-deep); color: var(--blanco); padding-block: 12px; }
.mast .inner { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; }
.mast img { display: block; width: min(170px, 44vw); height: auto; }
.who { display: flex; gap: 10px; align-items: center; font-size: 14px; flex-wrap: wrap; }
.who b { color: var(--gold); }
main { padding-block: 18px 60px; }
main .inner { display: grid; gap: 16px; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(24px, 5vw, 32px); line-height: 1.1; }
h2 { margin: 0; font-size: 18px; font-weight: 800; }
h3 { margin: 0; font-size: 12px; font-weight: 800; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 12px; color: var(--muted); }
.mono { font-family: var(--f-mono); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
button { font: 700 16px var(--f-body); border-radius: 10px; cursor: pointer; padding: 10px 16px; border: 2px solid var(--navy); background: var(--navy); color: var(--blanco); min-height: 46px; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.ok { background: var(--green); border-color: var(--green); }
button.warn { background: var(--red); border-color: var(--red); }
button.sm { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.mast button.ghost { color: var(--blanco); border-color: rgba(255,255,255,.35); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input, select, textarea { font: 16px var(--f-body); padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); min-width: 0; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.scan { display: flex; gap: 10px; }
.scan input { flex: 1; font: 600 24px var(--f-mono); padding: 14px 16px; border: 3px solid var(--navy); letter-spacing: .03em; }
.notice { border-radius: 10px; padding: 11px 14px; font-size: 14px; background: var(--amber-bg); }
.notice.bad { background: var(--red-bg); }
.notice.good { background: var(--green-bg); }

/* Mensaje grande después de cada escaneo */
.flash { border-radius: 12px; padding: 14px 18px; font-weight: 800; font-size: 20px; line-height: 1.25; display: grid; gap: 2px; }
.flash small { font-size: 14px; font-weight: 600; }
.flash.ok { background: var(--green-bg); color: var(--green); }
.flash.err { background: var(--fill-red); color: var(--blanco); animation: shake .35s; }
.flash.info { background: var(--soft); color: var(--ink); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .flash.err { animation: none; } }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.kpi span { display: block; font-size: 11px; font-weight: 800; color: var(--muted); }
.kpi b { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); }

.tbl { overflow: auto; border: 1px solid var(--line); border-radius: 10px; max-height: 60vh; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; font-weight: 800; color: var(--muted); background: var(--soft); position: sticky; top: 0; z-index: 1; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.big { font-size: 18px; font-weight: 900; }
tr.done td { color: var(--muted); }
tr.over td { background: var(--red-bg); }
tr.cur td { background: var(--amber-bg); }
.chip { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: var(--soft); white-space: nowrap; }
.chip.g { background: var(--green-bg); color: var(--green); }
.chip.r { background: var(--red-bg); color: var(--red); }
.chip.a { background: var(--amber-bg); color: var(--amber); }
.list { display: grid; gap: 8px; }
.item { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; color: var(--ink); font-weight: 600; width: 100%; min-height: 0; }
.item:hover { border-color: var(--navy); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
dialog { border: 0; border-radius: 14px; padding: 20px; width: min(460px, calc(100% - 24px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(11,23,72,.55); }
dialog form { display: grid; gap: 12px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.tile .tt { font-size: 28px; font-weight: 900; letter-spacing: .02em; }
.tile.on { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
.tile.full { opacity: .7; }
.gaf { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.gf { border: 2px dashed var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 2px; justify-items: center; background: var(--blanco); color: #000; }
.gf b { font-size: 18px; } .gf span { font-size: 12px; color: #555; } .gf svg { width: 100%; max-width: 230px; }
/* Etiqueta de caja (se imprime en 4 x 6 pulgadas).
   Al imprimir se oculta todo lo demás con display:none (no visibility), para que la página mida una sola etiqueta:
   con visibility el resto seguía ocupando espacio y la etiqueta fija se repetía en cada hoja (salían 3). */
#etiqueta { display: none; }
@media print {
  @page { size: 4in 6in; margin: 0; }
  html, body { margin: 0 !important; padding: 0 !important; background: var(--blanco) !important; height: auto !important; }
  :root { padding: 0 !important; }
  body > *:not(#etiqueta) { display: none !important; }
  #etiqueta { display: block !important; position: static; width: 4in; height: 5.95in; overflow: hidden; padding: .25in; color: #000; background: var(--blanco);
    font-family: Arial, sans-serif; break-after: avoid; page-break-after: avoid; break-inside: avoid; }
}
.et-top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid #000; padding-bottom: 6px; }
.et-top b { font-size: 22px; letter-spacing: .1em; }
.et-tienda { font-size: 64px; font-weight: 900; line-height: 1; margin: 14px 0 4px; }
.et-caja { font-size: 40px; font-weight: 900; }
.et-l { font-size: 14px; margin: 3px 0; }
.et-sello { font-size: 22px; font-weight: 900; border: 3px solid #000; padding: 6px 10px; display: inline-block; margin: 10px 0; }
#etiqueta svg { width: 100%; height: 1.3in; }

/* Arreglos de la auditoría de diseño (noviembre 2026) */
:root { --blanco: oklch(99% 0.004 270); --fill-red: #c42318; --fill-green: #157a3d; }
html, body { overflow-x: clip; }
button:active:not(:disabled) { transform: scale(0.98); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--ink); outline-offset: 1px; }
a.logo-link { display: inline-block; border-radius: 4px; line-height: 0; }
a.logo-link:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
body :is(a, button, input, select, textarea, summary, [tabindex]):focus-visible { outline-color: var(--ink); }
body .mast :is(a, button, input, select, textarea, summary, [tabindex]):focus-visible { outline-color: var(--gold); }
</style>
<body>
<header class="mast pad"><div class="inner">
  <a class="logo-link" href="../cedis/" aria-label="Volver a las herramientas de CEDIS" title="Volver a CEDIS"><img src="../checador/logo.png" alt="De Museo" width="800" height="144"></a>
  <div class="who" id="who" hidden><span id="whoTxt"></span><button type="button" class="ghost sm" id="btnInicio">Inicio</button><button type="button" class="ghost sm" id="btnSalir">Salir</button></div>
</div></header>
<main class="pad"><div class="inner" id="app"></div></main>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<script>
// App de PILOTOS: misma conexión y misma hoja que Despachos, pero solo con lo del piloto:
// cargar el camión escaneando cada caja (etiqueta + sello), aceptar la carga y entregar en cada tienda.
const $ = id => document.getElementById(id);
const app = $("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const limpio = s => String(s || "").trim().replace(/\s+/g, "").toUpperCase();
const hora = d => new Date(d).toLocaleString("es-GT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

// ---------------------------------------------------------------- sonidos
const SND = { ok: new Audio("../checador/sonido-normal.wav"), bien: new Audio("../checador/sonido-bazar.wav"), err: new Audio("../despacho/error.wav") };
Object.values(SND).forEach(a => { a.preload = "auto"; a.volume = 1; });
let sndOn = false;
document.addEventListener("pointerdown", () => { if (sndOn) return; sndOn = true; Object.values(SND).forEach(a => { a.muted = true; a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; }); }); }, { once: true });
const sonar = k => { try { const a = SND[k]; a.currentTime = 0; a.play().catch(() => {}); } catch (e) {} if (k === "err" && navigator.vibrate) navigator.vibrate([120, 60, 120]); };

let FLASH = null;
// ---------------------------------------------------------------- servidor
let CFG = lsGet("despacho-cfg", null);     // { url, token }
let OP = lsGet("piloto-op", null);       // operador en turno
async function api(accion, datos) {
  const body = JSON.stringify(Object.assign({ accion, token: CFG.token, operador: OP && OP.codigo, sesion: OP && OP.sesion }, datos || {}));
  // Por GET cuando cabe en la dirección (funciona en todos los navegadores); por POST si es muy grande
  let r;
  try {
    r = body.length < 6000
      ? await fetch(CFG.url + (CFG.url.includes("?") ? "&" : "?") + "q=" + encodeURIComponent(body), { method: "GET", redirect: "follow" })
      : await fetch(CFG.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body, redirect: "follow" });
  } catch (e) {
    throw new Error("No hay conexión con el servidor. Revisa el internet; si sigue, revisa que la implementación tenga acceso para \"Cualquier persona\".");
  }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error("El servidor no respondió bien. Avisa a sistemas. Detalle técnico: la dirección debe terminar en /exec y el código debe estar implementado como nueva versión."); }
  if (!j.ok) {
    const m = String(j.error || "Error del servidor");
    if (/^SESION\|/.test(m)) { OP = null; lsDel("piloto-op"); pantallaLogin(m.slice(7)); throw new Error(m.slice(7)); }
    throw new Error(m.replace(/^PIN\|/, ""));
  }
  return j.datos;
}
function cargando(txt) { app.innerHTML = `<section class="card"><p class="muted">${esc(txt || "Cargando…")}</p></section>`; }
function error(e, volver) {
  app.innerHTML = `<section class="card"><p class="notice bad">${esc(e.message || e)}</p><div class="row"><button type="button" id="reint">Intentar de nuevo</button></div></section>`;
  $("reint").onclick = volver || inicio;
}

// ---------------------------------------------------------------- inicio de sesión
function pantallaConfig() {
  $("who").hidden = true;
  app.innerHTML = `<section class="card"><h1>Configurar este equipo</h1>
    <p class="muted">Se hace una sola vez en cada equipo. Pega la dirección del servidor y la clave de la app que te dieron.</p>
    <form id="fCfg" style="display:grid;gap:12px" autocomplete="off">
      <label class="f">Dirección del servidor<input id="cUrl" placeholder="https://script.google.com/macros/s/…/exec" required></label>
      <label class="f">Clave de la app<input id="cTok" type="password" required></label>
      <p class="notice bad" id="cErr" hidden></p>
      <button type="submit">Guardar y probar</button></form></section>`;
  $("fCfg").onsubmit = async e => {
    e.preventDefault();
    CFG = { url: $("cUrl").value.trim(), token: $("cTok").value.trim() };
    try { await api("ping"); lsSet("despacho-cfg", CFG); pantallaLogin(); }
    catch (er) { $("cErr").textContent = "No se pudo conectar: " + er.message; $("cErr").hidden = false; }
  };
}
function pantallaLogin(aviso) {
  $("who").hidden = true;
  app.innerHTML = `<section class="card"><h1>¿Quién está trabajando?</h1>
    <p class="muted">Piloto: escanea tu gafete o escribe tu código. Todo lo que hagas queda registrado a tu nombre.</p>
    <form id="fLog" autocomplete="off" style="display:grid;gap:10px"><input id="lCod" placeholder="Código de operador" autofocus><input type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" style="font:600 20px var(--f-mono);letter-spacing:.3em" id="lPin"><button type="submit">Entrar</button></form>
    <p class="notice bad" id="lErr" ${aviso ? "" : "hidden"}>${esc(aviso || "")}</p>
    <p class="small"><a href="#" id="lCfg">Configurar este equipo</a></p></section>`;
  $("lCod").focus();
  $("lCod").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("lPin").focus(); } };
  $("lCfg").onclick = e => { e.preventDefault(); pantallaConfig(); };
  $("fLog").onsubmit = async e => {
    e.preventDefault();
    const c = limpio($("lCod").value); if (!c) return;
    const pin = $("lPin").value.trim(); if (!pin) { $("lPin").focus(); return; }
    try {
      const o = await api("login", { codigo: c, pin });
      if (o.rol !== "PILOTO") throw new Error("Esta app es solo para pilotos. " + o.codigo + " está registrado como " + o.rol + ": usa la app de Despachos.");
      OP = o; lsSet("piloto-op", OP); tocar(); inicio();
    }
    catch (er) { sonar("err"); $("lErr").textContent = er.message; $("lErr").hidden = false; $("lPin").value = ""; $("lPin").focus(); }
  };
}
$("btnSalir").onclick = () => { OP = null; lsDel("piloto-op"); pantallaLogin(); };
$("btnInicio").onclick = () => inicio();
// Cambio de operador automático tras 60 minutos sin uso (equipos compartidos)
let tOcio;
function tocar() { clearTimeout(tOcio); tOcio = setTimeout(() => { if (OP) { OP = null; lsDel("piloto-op"); pantallaLogin(); } }, 60 * 60000); }
["keydown", "pointerdown"].forEach(ev => document.addEventListener(ev, () => OP && tocar(), { passive: true }));

function inicio() {
  if (!CFG) return pantallaConfig();
  if (!OP) return pantallaLogin();
  $("who").hidden = false;
  $("whoTxt").innerHTML = `<b>${esc(OP.nombre)}</b> · ${esc(OP.rol === "TIENDA" ? "Tienda " + OP.tienda : OP.rol === "SUPERVISOR" ? "Supervisor" : OP.rol === "PILOTO" ? "Piloto" : "CEDIS")}`;
  return menu();
}
function dialogo(html, alAbrir) {
  $("dlgForm").innerHTML = html; const d = $("dlg");
  try { d.showModal(); } catch (e) { d.setAttribute("open", ""); }
  if (alAbrir) alAbrir();
  return d;
}
// ---------------------------------------------------------------- CEDIS: carga del camión
// Cada caja se revisa al subirla: etiqueta + sello. Rechaza etiquetas cambiadas, sellos que no coinciden
// y cajas que no van en la ruta del camión.
let CARGA = null;   // { camion, ruta:[tiendas], hechas:[{tienda,traslado,caja,unidades}], paso, actual }
async function iniciarCarga() {
  cargando("Buscando cajas listas para cargar…");
  try {
    const cs = await api("porCargar", {});
    CARGA = lsGet("despacho-carga", null);
    if (CARGA) return pintarCarga(cs);
    const por = {}; cs.forEach(c => { por[c.tienda] = (por[c.tienda] || 0) + 1; });
    const ts = Object.keys(por).sort();
    app.innerHTML = `<section class="card"><div class="row between"><h1>Cargar camión</h1><button type="button" class="ghost sm" id="cVol">Menú</button></div>
      <p class="muted">Antes de subir cada caja se escanea su etiqueta y su sello. La app confirma que coinciden y que la caja va en la ruta de este camión.</p>
      <label class="f">Camión, placa o piloto<input id="cCam" placeholder="Ej.: P-123ABC · Juan" autocomplete="off"></label>
      <h3>Tiendas de esta ruta</h3>
      ${ts.length ? `<div class="row"><button type="button" class="ghost sm" id="cTodas">Marcar todas</button></div>
        <div class="list">${ts.map(t => `<label class="item" style="cursor:pointer"><span class="row" style="gap:10px;flex-wrap:nowrap"><input type="checkbox" data-rt="${t}" style="width:22px;height:22px"><b>${esc(t)}</b></span><span class="chip">${por[t]} ${por[t] === 1 ? "caja" : "cajas"}</span></label>`).join("")}</div>`
        : '<p class="muted">No hay cajas cerradas pendientes de cargar.</p>'}
      <p class="notice bad" id="cErr" hidden></p>
      <div class="row" style="justify-content:flex-end"><button type="button" id="cIni" ${ts.length ? "" : "disabled"}>Empezar carga</button></div></section>`;
    $("cVol").onclick = menu;
    if ($("cTodas")) $("cTodas").onclick = () => app.querySelectorAll("[data-rt]").forEach(c => c.checked = true);
    $("cIni").onclick = () => {
      const ruta = [...app.querySelectorAll("[data-rt]")].filter(c => c.checked).map(c => c.dataset.rt), cam = $("cCam").value.trim();
      if (!cam || !ruta.length) { sonar("err"); $("cErr").textContent = "Escribe el camión y marca al menos una tienda."; $("cErr").hidden = false; return; }
      CARGA = { camion: cam, ruta, hechas: [], paso: "etiqueta", actual: null }; lsSet("despacho-carga", CARGA); FLASH = null; pintarCarga(cs);
    };
  } catch (e) { error(e, menu); }
}
function pintarCarga(cs) {
  CARGA.pend = cs || CARGA.pend || [];
  const pend = CARGA.pend.filter(c => CARGA.ruta.includes(c.tienda) && !CARGA.hechas.some(h => h.traslado === c.traslado && h.caja === c.caja));
  const tot = CARGA.hechas.length + pend.length;
  const porT = {}; CARGA.ruta.forEach(t => porT[t] = { h: 0, p: 0 });
  CARGA.hechas.forEach(h => { if (porT[h.tienda]) porT[h.tienda].h++; }); pend.forEach(c => porT[c.tienda].p++);
  const a = CARGA.actual;
  app.innerHTML = `<section class="card">
    <div class="row between"><div><h3>Camión ${esc(CARGA.camion)} · ${esc(CARGA.ruta.join(", "))}</h3><h1>${CARGA.paso === "sello" ? "Ahora el sello" : "Escanea la etiqueta"}</h1></div>
      <button type="button" class="ghost sm" id="cSalir">Salir</button></div>
    <div class="kpis"><div class="kpi"><span>Cargadas</span><b>${CARGA.hechas.length}</b> <span style="display:inline">de ${tot}</span></div></div>
    <div class="bar"><i style="width:${tot ? Math.round(CARGA.hechas.length / tot * 100) : 0}%"></i></div>
    ${CARGA.paso === "sello" && a ? `<div class="flash info" style="font-size:20px"><span style="font:900 clamp(36px,8vw,56px)/1 var(--f-body)">${esc(a.tienda)}</span> caja ${a.caja}${a.de ? " de " + a.de : ""}<small>${esc(a.traslado)} · ahora escanea el número del sello de esta misma caja</small></div>` : ""}
    <form class="scan" id="fCg" autocomplete="off"><input id="cg" placeholder="${CARGA.paso === "sello" ? "Número del sello" : "Etiqueta de la caja"}" inputmode="none"><button type="submit">${CARGA.paso === "sello" ? "Revisar" : "Siguiente"}</button></form>
    ${FLASH ? `<div class="flash ${FLASH.t}" ${FLASH.big ? 'style="font-size:20px"' : ""}>${FLASH.big ? `<span style="font:900 clamp(36px,8vw,56px)/1 var(--f-body)">${FLASH.big}</span>` : ""}${FLASH.h}${FLASH.s ? `<small>${FLASH.s}</small>` : ""}</div>` : ""}
    <div class="row">${CARGA.paso === "sello" ? '<button type="button" class="ghost" id="cOtra">Cancelar esta caja</button>' : ""}<button type="button" id="cFin">Terminar carga</button></div>
  </section>
  <section class="card"><h3>Por tienda</h3><div class="tiles">${CARGA.ruta.map(t => `<div class="tile ${porT[t].p ? "" : "full"}"><b class="tt">${esc(t)}</b><div class="small">${porT[t].h} cargadas · ${porT[t].p ? `<b>faltan ${porT[t].p}</b>` : "completa ✓"}</div></div>`).join("")}</div>
    ${pend.length ? `<details><summary>Cajas que faltan (${pend.length})</summary><div class="list">${pend.map(c => `<div class="row between"><span><b>${esc(c.tienda)}</b> · <span class="mono">${esc(c.traslado)}</span> caja ${c.caja} de ${c.de || "?"}</span><span class="small">${c.unidades} uds.</span></div>`).join("")}</div></details>` : ""}</section>`;
  $("cg").focus();
  $("cSalir").onclick = () => { if (confirm("¿Salir? La carga queda guardada en este equipo y puedes seguir después.")) menu(); };
  if ($("cOtra")) $("cOtra").onclick = () => { CARGA.paso = "etiqueta"; CARGA.actual = null; lsSet("despacho-carga", CARGA); FLASH = null; pintarCarga(); };
  $("cFin").onclick = terminarCarga;
  $("fCg").onsubmit = async e => {
    e.preventDefault(); const v = limpio($("cg").value); if (!v) return;
    if (CARGA.paso === "etiqueta") {
      const m = v.match(/^77(\d{8})(\d{3})$/);
      if (!m) { sonar("err"); FLASH = { t: "err", h: "Esa no es una etiqueta de caja", s: "Escanea el código de barras de la etiqueta." }; return pintarCarga(); }
      const tid = +m[1], caja = +m[2];
      if (CARGA.hechas.some(h => h.trasladoId === tid && h.caja === caja)) { sonar("err"); FLASH = { t: "err", h: "Esta caja ya se cargó en este camión" }; return pintarCarga(); }
      const c = CARGA.pend.find(x => x.trasladoId === tid && x.caja === caja);
      if (c && !CARGA.ruta.includes(c.tienda)) { sonar("err"); FLASH = { t: "err", big: "" + esc(c.tienda), h: "No va en este camión", s: `La ruta es ${esc(CARGA.ruta.join(", "))}. Aparta la caja.` }; return pintarCarga(); }
      CARGA.actual = c || { trasladoId: tid, caja, tienda: "?", traslado: "Caja " + caja };
      CARGA.paso = "sello"; lsSet("despacho-carga", CARGA); sonar("ok"); FLASH = null; return pintarCarga();
    }
    const act = CARGA.actual;
    try {
      const r = await api("cargarCaja", { trasladoId: act.trasladoId, traslado: act.traslado, caja: act.caja, sello: v, ruta: CARGA.ruta, camion: CARGA.camion });
      CARGA.hechas.push({ trasladoId: act.trasladoId, traslado: r.traslado, caja: r.caja, tienda: r.tienda, unidades: r.unidades });
      sonar("ok"); FLASH = { t: "ok", big: "✓ " + esc(r.tienda), h: ` caja ${r.caja}: súbela al camión`, s: "Etiqueta y sello coinciden." };
    } catch (er) { sonar("err"); FLASH = { t: "err", big: "No cargar", h: "", s: esc(er.message) }; }
    CARGA.paso = "etiqueta"; CARGA.actual = null; lsSet("despacho-carga", CARGA); pintarCarga();
  };
}
function terminarCarga() {
  const pend = (CARGA.pend || []).filter(c => CARGA.ruta.includes(c.tienda) && !CARGA.hechas.some(h => h.traslado === c.traslado && h.caja === c.caja));
  const n = CARGA.hechas.length;
  const d = dialogo(`<h2>Terminar carga</h2><p>Camión <b>${esc(CARGA.camion)}</b>: ${n} cajas cargadas.</p>
    ${pend.length ? `<p class="notice bad">Faltan ${pend.length} cajas de esta ruta:<br>${pend.slice(0, 12).map(c => `${esc(c.tienda)} · ${esc(c.traslado)} caja ${c.caja}`).join("<br>")}${pend.length > 12 ? "<br>…" : ""}</p><p class="small">Si salen en otro viaje, termina igual; quedan pendientes para la siguiente carga.</p>` : '<p class="notice good">Todas las cajas de la ruta están cargadas. ✓</p>'}
    ${n ? `<p>Al aceptar, las ${n} cajas quedan <b>a tu cargo</b> hasta que las entregues en cada tienda.</p>
      <label class="f">Encargado del CEDIS que autoriza la salida (gafete o código)<input id="tDes" autocomplete="off" style="text-transform:uppercase;font:600 20px var(--f-mono)"></label><label class="f">PIN del encargado del CEDIS<input type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" style="font:600 20px var(--f-mono);letter-spacing:.3em" id="tDesPin"></label>` : ""}
    <p class="notice bad" id="tErr" hidden></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="ghost" id="tNo">Seguir cargando</button><button type="submit">${n ? "Aceptar la carga" : "Terminar"}</button></div>`);
  $("tNo").onclick = () => d.close();
  if ($("tDes")) setTimeout(() => $("tDes").focus(), 50);
  $("dlgForm").onsubmit = async e => {
    e.preventDefault();
    if (n) {
      const pil = OP.codigo, des = limpio($("tDes").value).toUpperCase();
      if (!des) { $("tErr").textContent = "Falta el código del encargado del CEDIS que autoriza la salida."; $("tErr").hidden = false; return; }
      const bt = $("dlgForm").querySelector("[type=submit]"); bt.disabled = true;
      const datos = { piloto: pil, despacha: des, pinDespacha: $("tDesPin").value.trim(), camion: CARGA.camion, cajas: CARGA.hechas.map(h => ({ trasladoId: h.trasladoId, caja: h.caja })) };
      if ($("tSup")) { datos.autoriza = limpio($("tSup").value).toUpperCase(); datos.pinAutoriza = $("tSupPin").value.trim(); datos.motivo = $("tMot").value.trim(); }
      try {
        const r = await api("firmarCarga", datos);
        d.close(); lsDel("despacho-carga"); CARGA = null; sonar("bien"); FLASH = null; return pantallaManifiesto(r);
      } catch (er) {
        sonar("err"); bt.disabled = false;
        if (/^PARCIAL\|/.test(er.message) && !$("tSup")) {
          $("tErr").innerHTML = esc(er.message.slice(8)) + "<br><b>Un pedido con varias cajas debe salir completo en el mismo camión.</b> Carga las cajas que faltan, o pide a un supervisor que autorice enviarlo incompleto.";
          $("tErr").hidden = false;
          $("tErr").insertAdjacentHTML("afterend", `<label class="f">Código del supervisor que autoriza<input id="tSup" autocomplete="off" style="text-transform:uppercase"></label><label class="f">PIN del supervisor<input type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" style="font:600 20px var(--f-mono);letter-spacing:.3em" id="tSupPin"></label><label class="f">Motivo<input id="tMot" placeholder="Ej.: no cupo en el camión"></label>`);
          bt.textContent = "Autorizar y firmar";
        } else { $("tErr").textContent = er.message.replace(/^PARCIAL\|/, ""); $("tErr").hidden = false; }
        return;
      }
    } else FLASH = { t: "ok", h: "Carga terminada" };
    d.close(); lsDel("despacho-carga"); CARGA = null; sonar("bien"); menu();
  };
}

// ---------------------------------------------------------------- PILOTO: entregas en tienda
// Las cajas quedan a cargo del piloto desde que firma la carga hasta que el encargado de la tienda las recibe en su tablet.
let ENT = null;   // { tienda, escaneadas:[{trasladoId,caja}] }
async function misEntregas() {
  cargando("Buscando tus entregas…");
  try {
    const cs = await api("misEntregas", {});
    const por = {}; cs.forEach(c => (por[c.tienda] = por[c.tienda] || []).push(c));
    app.innerHTML = `<section class="card"><h1>Mis entregas</h1>
      <p class="muted">Cajas a tu cargo. En cada tienda, toca la tienda, escanea cada caja que entregas y pide al encargado que confirme con su código.</p>
      ${FLASH ? `<div class="flash ${FLASH.t}">${FLASH.h}${FLASH.s ? `<small>${FLASH.s}</small>` : ""}</div>` : ""}
      <div class="list">${Object.keys(por).sort().map(t => `<button type="button" class="item" data-ti="${t}" style="text-align:left"><span><b style="font-size:22px">${esc(t)}</b></span><span class="chip">${por[t].length} ${por[t].length === 1 ? "caja" : "cajas"}</span></button>`).join("") || '<p class="muted">No tienes cajas pendientes de entregar. ✓</p>'}</div></section>`;
    app.querySelectorAll("[data-ti]").forEach(b => b.onclick = () => { ENT = { tienda: b.dataset.ti, escaneadas: [], cajas: por[b.dataset.ti] }; FLASH = null; pintarEntrega(); });
  } catch (e) { error(e, misEntregas); }
}
function pintarEntrega() {
  const hechas = ENT.escaneadas.length, tot = ENT.cajas.length;
  app.innerHTML = `<section class="card">
    <div class="row between"><div><h3>Entrega</h3><h1>${esc(ENT.tienda)}</h1></div><button type="button" class="ghost sm" id="eVol">Mis entregas</button></div>
    <div class="kpis"><div class="kpi"><span>Escaneadas</span><b>${hechas}</b> <span style="display:inline">de ${tot}</span></div></div>
    <div class="bar"><i style="width:${tot ? Math.round(hechas / tot * 100) : 0}%"></i></div>
    <form class="scan" id="fEn" autocomplete="off"><input id="en" placeholder="Escanea la etiqueta de cada caja que entregas" inputmode="none"><button type="submit">+1</button></form>
    ${FLASH ? `<div class="flash ${FLASH.t}">${FLASH.h}${FLASH.s ? `<small>${FLASH.s}</small>` : ""}</div>` : ""}
    <div class="list">${ENT.cajas.map(c => { const ok = ENT.escaneadas.some(x => x.trasladoId === c.trasladoId && x.caja === c.caja); return `<div class="row between"><span>${ok ? "✓" : "○"} <span class="mono">${esc(c.traslado)}</span> caja ${c.caja} de ${c.de || "?"}</span><span class="small">sello ${esc(c.sello)}</span></div>`; }).join("")}</div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="ok" id="eConf" ${hechas ? "" : "disabled"}>El encargado confirma la entrega</button></div></section>`;
  $("en").focus();
  $("eVol").onclick = misEntregas;
  $("fEn").onsubmit = e => {
    e.preventDefault(); const v = limpio($("en").value); const m = v.match(/^77(\d{8})(\d{3})$/);
    if (!m) { sonar("err"); FLASH = { t: "err", h: "Esa no es una etiqueta de caja" }; return pintarEntrega(); }
    const c = ENT.cajas.find(x => x.trasladoId === +m[1] && x.caja === +m[2]);
    if (!c) { sonar("err"); FLASH = { t: "err", h: "Esta caja no es para " + esc(ENT.tienda), s: "No la entregues aquí. Revisa a qué tienda va." }; return pintarEntrega(); }
    if (ENT.escaneadas.some(x => x.trasladoId === c.trasladoId && x.caja === c.caja)) { sonar("err"); FLASH = { t: "err", h: "Esa caja ya la escaneaste" }; return pintarEntrega(); }
    ENT.escaneadas.push({ trasladoId: c.trasladoId, caja: c.caja }); sonar("ok"); FLASH = { t: "ok", h: `✓ Caja ${c.caja} de ${esc(c.traslado)}` }; pintarEntrega();
  };
  $("eConf").onclick = () => {
    const falta = ENT.cajas.length - ENT.escaneadas.length;
    const d = dialogo(`<h2>Entrega en ${esc(ENT.tienda)}</h2><p>Entregas <b>${ENT.escaneadas.length}</b> ${ENT.escaneadas.length === 1 ? "caja" : "cajas"}.</p>
      ${falta ? `<p class="notice bad">Quedan ${falta} cajas de ${esc(ENT.tienda)} sin entregar: siguen a tu cargo.</p>` : ""}
      <p class="small">El encargado de la tienda revisa que las cajas estén cerradas con sello y confirma con su código (o su gafete). No hace falta abrirlas.</p>
      <label class="f">Código del encargado de la tienda<input id="eRec" autocomplete="off" style="text-transform:uppercase;font:600 20px var(--f-mono)"></label><label class="f">PIN del encargado<input type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" style="font:600 20px var(--f-mono);letter-spacing:.3em" id="eRecPin"></label><p class="notice bad" id="eErr" hidden></p>
      <div class="row" style="justify-content:flex-end"><button type="button" class="ghost" id="eNo">Cancelar</button><button type="submit" class="ok">Confirmar entrega</button></div>`);
    setTimeout(() => $("eRec").focus(), 50); $("eNo").onclick = () => d.close();
    $("dlgForm").onsubmit = async ev => {
      ev.preventDefault(); const rec = limpio($("eRec").value).toUpperCase(); if (!rec) return;
      const bt = $("dlgForm").querySelector("[type=submit]"); bt.disabled = true;
      try { const r = await api("entregarCajas", { cajas: ENT.escaneadas, recibe: rec, pinRecibe: $("eRecPin").value.trim() }); d.close(); sonar("bien"); FLASH = { t: "ok", h: `Entrega registrada: ${r.cajas} cajas`, s: "Recibió " + esc(r.recibio) }; ENT = null; misEntregas(); }
      catch (er) { sonar("err"); $("eErr").textContent = er.message; $("eErr").hidden = false; bt.disabled = false; }
    };
  };
}

// ---------------------------------------------------------------- manifiesto de carga (para imprimir o guardar en PDF)
function manifiestoHTML(m) {
  const por = {}; m.manifiesto.forEach(c => (por[c.tienda] = por[c.tienda] || []).push(c));
  const uds = m.manifiesto.reduce((a, c) => a + c.unidades, 0);
  return `<!doctype html><meta charset="utf-8"><title>Manifiesto de carga ${esc(m.fecha)}</title>
  <style>body{font:12px Arial,sans-serif;margin:12mm;color:#000}h1{font-size:22px;margin:0}h2{font-size:16px;margin:16px 0 4px;border-bottom:2px solid #000}
  table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #999;padding:5px 4px;text-align:left}th{font-size:10px;text-transform:uppercase}
  .n{text-align:right}.b{width:16px;height:16px;border:2px solid #000;display:inline-block}.head{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin:8px 0}
  .firmas{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:10px}.firmas div{border-top:1px solid #000;padding-top:4px;margin-top:30px}
  .nota{border:2px solid #000;padding:6px;margin:8px 0;font-weight:bold}.tienda{break-inside:avoid}</style>
  <h1>De Museo · Manifiesto de carga</h1>
  <div class="head"><div><b>Fecha:</b> ${esc(m.fecha)}</div><div><b>Camión:</b> ${esc(m.camion)}</div><div><b>Piloto:</b> ${esc(m.piloto)} (${esc(m.pilotoCodigo)})</div><div><b>Cargó:</b> ${esc(m.operador)}</div>
  <div><b>Total:</b> ${m.manifiesto.length} cajas · ${uds} unidades</div><div><b>Tiendas:</b> ${Object.keys(por).join(", ")}</div></div>
  ${m.nota ? `<div class="nota">${esc(m.nota)}</div>` : ""}
  ${Object.keys(por).map(t => `<div class="tienda"><h2>${esc(t)} · ${por[t].length} ${por[t].length === 1 ? "caja" : "cajas"}</h2>
    <table><thead><tr><th>✓</th><th>Pedido</th><th>Caja</th><th>Sello</th><th class="n">Unidades</th></tr></thead><tbody>
    ${por[t].map(c => `<tr><td><span class="b"></span></td><td>${esc(c.traslado)}</td><td><b>${c.caja} de ${c.de}</b></td><td>${esc(c.sello)}</td><td class="n">${c.unidades}</td></tr>`).join("")}</tbody></table>
    <div class="firmas"><div>Entregó (piloto): ${esc(m.piloto)}</div><div>Recibió (${esc(t)}): nombre y firma</div></div></div>`).join("")}
  <div class="firmas" style="margin-top:24px"><div>Despachó (CEDIS): ${esc(m.operador)}</div><div>Piloto: ${esc(m.piloto)}</div></div>`;
}
function imprimirManifiesto(m) {
  const w = window.open("", "_blank");
  if (!w) { alert("Permite las ventanas emergentes para imprimir el manifiesto."); return; }
  w.document.write(manifiestoHTML(m) + "<script>setTimeout(()=>print(),300)<\/script>"); w.document.close();
}
function pantallaManifiesto(m) {
  lsSet("despacho-ultimo-manifiesto", m);
  app.innerHTML = `<section class="card"><h1>Carga firmada ✓</h1>
    <p><b>${m.cajas}</b> cajas a cargo de <b>${esc(m.piloto)}</b> · camión ${esc(m.camion)}</p>
    ${m.nota ? `<p class="notice bad">${esc(m.nota)}</p>` : ""}
    <p class="muted">Imprime el manifiesto (o guárdalo en PDF desde la ventana de impresión) y entrégalo al piloto. Cada tienda lo usa como lista para revisar que llegó todo.</p>
    <div class="row"><button type="button" id="mImp">Imprimir / guardar PDF</button><button type="button" class="ghost" id="mMenu">Menú</button></div></section>
    <section class="card"><div style="overflow:auto">${manifiestoHTML(m).replace(/^[\s\S]*?<h1>/, "<h1>").replace(/<script[\s\S]*$/, "")}</div></section>`;
  $("mImp").onclick = () => imprimirManifiesto(m);
  $("mMenu").onclick = menu;
}


// ---------------------------------------------------------------- inicio del piloto
async function menu() {
  let n = 0; try { n = (await api("misEntregas", {})).length; } catch (e) {}
  const carga = lsGet("despacho-carga", null);
  app.innerHTML = `<section class="card"><h1>Hola, ${esc(OP.nombre.split(" ")[0])}</h1>
    ${FLASH ? `<div class="flash ${FLASH.t}">${FLASH.h}${FLASH.s ? `<small>${FLASH.s}</small>` : ""}</div>` : ""}
    <div class="list">
      <button type="button" class="item" id="hCar" style="min-height:90px;font-size:22px"><span>${carga ? "Seguir cargando el camión" : "Cargar el camión"}<br><span class="small">Escanea cada caja antes de salir</span></span><span>→</span></button>
      <button type="button" class="item" id="hEnt" style="min-height:90px;font-size:22px"><span>Mis entregas<br><span class="small">${n ? n + " cajas a tu cargo" : "Sin cajas pendientes"}</span></span><span>→</span></button>
      <button type="button" class="item" id="hMan"><span>Ver el último manifiesto</span><span>→</span></button>
    </div></section>`;
  FLASH = null;
  $("hCar").onclick = iniciarCarga; $("hEnt").onclick = misEntregas;
  $("hMan").onclick = () => { const m = lsGet("despacho-ultimo-manifiesto", null); if (m) pantallaManifiesto(m); else { FLASH = { t: "err", h: "Todavía no hay manifiesto en esta tablet" }; menu(); } };
}
inicio();
</script>
</body>
</html>
