<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Resurtido de Tiendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,900&family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Resurtido: qué mandar de la bodega a cada tienda, calculado cada noche con la venta de cada tienda. */
:root {
  --navy: #112369; --navy-deep: #0b1748; --on-navy: #fff;
  --bg: #f3f4f9; --surface: #fff; --ink: #111a3d; --muted: #5b6386; --line: #d9dcea; --soft: #e9ecf6;
  --red: #c42318; --red-bg: #fde8e6; --amber: #9a6700; --amber-bg: #fff3d1; --green: #157a3d; --green-bg: #e3f4e8; --gold: #f2bd3c;
  --f-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --navy: #2a40a0; --bg: #080e26; --surface: #111a3d; --ink: #edf0fa; --muted: #9da6c9; --line: #26315e; --soft: #18224c;
    --red: #ff7a6b; --red-bg: #3a1512; --amber: #f2bd3c; --amber-bg: #3a2f10; --green: #4fd383; --green-bg: #10331f; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1200px; margin: 0 auto; }
header.mast { background: var(--navy-deep); color: var(--on-navy); padding-block: 16px; }
.mast .inner { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.mast img { display: block; width: min(200px, 50vw); height: auto; }
.mast-t { font-family: var(--f-display); font-weight: 900; font-size: 22px; }
main { padding-block: 20px 56px; }
main .inner { display: grid; gap: 16px; }
h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(21px, 4.4vw, 27px); line-height: 1.15; }
h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 12px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
button { font: 700 15px var(--f-body); border-radius: 8px; cursor: pointer; padding: 9px 15px; border: 2px solid var(--navy); background: var(--navy); color: var(--on-navy); min-height: 42px; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.small-b { min-height: 32px; padding: 4px 10px; font-size: 13px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input, select { font: 15px var(--f-body); padding: 8px 10px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; }
input.q { width: 72px; text-align: right; padding: 5px 7px; font-weight: 700; }
.notice { border-radius: 10px; padding: 11px 14px; font-size: 14px; background: var(--amber-bg); }
.notice.bad { background: var(--red-bg); }
.notice.good { background: var(--green-bg); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.kpi span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kpi b { font-size: 24px; font-variant-numeric: tabular-nums; }
.kpi.bad b { color: var(--red); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; border-radius: 0; min-height: 40px; padding: 6px 10px; margin-bottom: -2px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--navy); }
.tabs .n { font-size: 12px; background: var(--soft); border-radius: 999px; padding: 1px 7px; margin-left: 4px; color: var(--ink); }
.tbl { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { position: sticky; top: 0; background: var(--surface); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); z-index: 1; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tr.off td { opacity: .45; }
.t { font-weight: 700; }
.chip { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 1px 7px; background: var(--soft); }
.chip.A { background: var(--green-bg); color: var(--green); }
.chip.B { background: var(--amber-bg); color: var(--amber); }
.chip.C { background: var(--soft); color: var(--muted); }
.chip.bad { background: var(--red-bg); color: var(--red); }
.bar { position: sticky; top: 0; z-index: 5; background: var(--navy-deep); color: #fff; border-radius: 12px; padding: 10px 14px; display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.bar b { font-size: 18px; }
.bar button { border-color: #fff; }
.bar button.ghost { color: #fff; border-color: rgba(255,255,255,.45); }
dialog { border: 0; border-radius: 14px; padding: 0; max-width: min(520px, calc(100vw - 32px)); width: 100%; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(5, 10, 30, .55); }
dialog form { padding: 18px 20px; display: grid; gap: 12px; }
.card > *, main .inner > * { min-width: 0; }
#filtros select, #filtros input { max-width: 100%; }
@media (max-width: 640px) { .hide-m { display: none; } #filtros > * { flex: 1 1 100%; } }
</style>
</head>
<body>
<header class="mast pad"><div class="inner"><img src="../checador/logo.png" alt="De Museo"><span class="mast-t">Resurtido de tiendas</span></div></header>
<main class="pad"><div class="inner" id="app">
  <section class="card" id="claveCard">
    <h2>Resurtido de tiendas</h2>
    <p class="muted">Cada noche se calcula qué mandar de la bodega a cada tienda según lo que vende, lo que tiene y lo que ya va en camino. Escribe la clave para abrir los datos.</p>
    <form id="claveForm" class="row" autocomplete="off"><input type="password" id="clave" placeholder="Clave" autocomplete="off"><button type="submit">Abrir</button></form>
    <p class="notice bad" id="claveErr" hidden></p>
  </section>
</div></main>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmt = n => Number(n || 0).toLocaleString("es-GT");
const app = $("app");
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const MOT = ["", "La bodega no alcanza para todas las tiendas", "No hay en bodega"];

let D = null, T = null, TAB = lsGet("resurtido-tab", "ped"), FIL = { q: "", clase: "", prov: "" };
let ED = {};
const SEL = new Set();   // tiendas marcadas para aprobar juntas   // ediciones del supervisor: { pid: { on, q } } para la tienda actual

async function descifrar(sobre, clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(sobre.s), iterations: sobre.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let plano;
  try { plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sobre.iv) }, key, b64(sobre.d)); } catch (e) { throw new Error("clave"); }
  return JSON.parse(await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
async function abrir(clave, silencioso) {
  $("claveErr").hidden = true;
  try {
    const r = await fetch("resurtido.enc?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("falta");
    D = await descifrar(await r.json(), clave);
    try { localStorage.setItem("surtido-clave", clave); } catch (e) {}   // misma clave que surtido, boletín y checador
    T = lsGet("resurtido-tienda", null);
    if (!D.tiendas.includes(T)) T = D.tiendas[0];
    cargarEd(); pintar();
  } catch (e) {
    if (silencioso) { lsDel("surtido-clave"); return; }
    $("claveErr").textContent = e.message === "clave" ? "Clave incorrecta." : e.message === "falta" ? "Todavía no se ha calculado el resurtido. Corre la sincronización en GitHub." : "No se pudieron abrir los datos en este navegador.";
    $("claveErr").hidden = false;
  }
}
$("claveForm").onsubmit = e => { e.preventDefault(); const c = $("clave").value.trim(); if (c) abrir(c); };
(() => { let c = null; try { c = localStorage.getItem("surtido-clave"); } catch (e) {} if (c) { try { c = JSON.parse(c); } catch (e) {} abrir(String(c), true); } })();

// ---------------------------------------------------------------- datos de la tienda
const P = pid => D.p[String(pid)] || ["", "", "Producto " + pid, 0, 0, 0];
const prov = pid => D.prov[P(pid)[3]] || "";
const S = () => D.s[T];
const edKey = () => `resurtido-ed-${T}-${D.v}`;
function cargarEd() {
  ED = lsGet(edKey(), {});
  // Limpia ediciones de otras fechas de cálculo
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.startsWith("resurtido-ed-") && !k.endsWith("-" + D.v)) localStorage.removeItem(k); } } catch (e) {}
}
const guardarEd = () => lsSet(edKey(), ED);
// Líneas del pedido: sugeridas (con bodega) + oportunidades marcadas
function lineasPedido(t) {
  t = t || T;
  const ed = t === T ? ED : lsGet(`resurtido-ed-${t}-${D.v}`, {}), s = D.s[t];
  const out = [];
  for (const x of s.l) {
    if (x[7] <= 0) continue;
    const e = ed[x[0]] || {};
    const on = e.on !== false, q = e.q != null ? e.q : x[7];
    out.push({ pid: x[0], q: on ? q : 0, x, tipo: "sug" });
  }
  for (const x of s.o) {
    const e = ed["o" + x[0]];
    if (e && e.on) out.push({ pid: x[0], q: e.q != null ? e.q : x[4], x, tipo: "opo" });
  }
  return out;
}
const totPedido = t => { const ls = lineasPedido(t).filter(l => l.q > 0); return { lineas: ls.length, uds: ls.reduce((s, l) => s + l.q, 0) }; };
function pasa(pid, clase) {
  if (FIL.clase && clase !== FIL.clase) return false;
  if (FIL.prov && String(P(pid)[3]) !== FIL.prov) return false;
  if (FIL.q) { const p = P(pid); const t = norm(p[2] + " " + p[0] + " " + p[1] + " " + prov(pid)); if (!norm(FIL.q).split(/\s+/).every(w => t.includes(w))) return false; }
  return true;
}

// ---------------------------------------------------------------- pantalla
function pintar() {
  const s = S(), tot = totPedido(), bor = D.bor[T];
  const sinBod = s.l.filter(x => x[9] === 2).length;
  const hoyToca = (D.cfg.calendario[T] || []).map(d => d.slice(0, 3).toLowerCase());
  app.innerHTML = `
  <section class="card">
    <div class="row between">
      <div><h3>Calculado ${esc(fechaLocal(D.v))} · desde ${esc(D.origen)}</h3><h2>${esc(D.nombres[T] || T)}</h2></div>
      <label class="row small" style="font-weight:700">Tienda
        <select id="tienda">${D.tiendas.map(t => `<option value="${t}" ${t === T ? "selected" : ""}>${esc(t)} · ${esc(D.nombres[t] || "")}</option>`).join("")}</select></label>
    </div>
    <div class="kpis">
      <div class="kpi"><span>Para mandar</span><b>${fmt(tot.uds)}</b><div class="small">${fmt(tot.lineas)} productos</div></div>
      <div class="kpi ${s.agA ? "bad" : ""}"><span>Más vendidos agotados aquí</span><b>${fmt(s.agA)}</b><div class="small">de ${fmt(s.nA)} productos A</div></div>
      <div class="kpi ${sinBod ? "bad" : ""}"><span>Faltan en bodega</span><b>${fmt(sinBod)}</b><div class="small">se venden aquí y no hay</div></div>
      <div class="kpi"><span>Para devolver</span><b>${fmt(s.d.reduce((a, x) => a + x[1], 0))}</b><div class="small">uds. sin venta en 12 semanas</div></div>
    </div>
    ${bor ? `<p class="notice">Hay un pedido en borrador para esta tienda (${esc(bor.nombre)}). Al aprobar, se reemplaza por lo que ves aquí.</p>` : ""}
    ${hoyToca.length ? `<p class="small">Días de resurtido de esta tienda: ${esc(hoyToca.join(", "))}.</p>` : ""}
  </section>
  <div class="bar"><span><b>${fmt(tot.uds)}</b> unidades · ${fmt(tot.lineas)} productos para ${esc(T)}</span>
    <span class="row"><button type="button" class="ghost" id="xls">Excel</button><button type="button" id="aprobar" ${tot.uds ? "" : "disabled"}>Aprobar y crear pedido</button></span></div>
  <section class="card">
    <div class="tabs" role="tablist">
      ${[["ped", "Pedido sugerido", s.l.filter(x => x[7] > 0).length], ["opo", "Oportunidades", s.o.length], ["fal", "Faltan en bodega", sinBod], ["dev", "Para devolver", s.d.length], ["prov", "Proveedores", ""], ["todas", "Todas las tiendas", ""]]
        .map(([k, t, n]) => `<button type="button" role="tab" data-tab="${k}" class="${TAB === k ? "on" : ""}">${t}${n !== "" ? `<span class="n">${fmt(n)}</span>` : ""}</button>`).join("")}
    </div>
    <div class="row" id="filtros"></div>
    <div id="vista"></div>
  </section>
  <section class="card"><details><summary>¿Cómo se calcula?</summary>
    <div class="muted" style="display:grid;gap:6px;margin-top:8px">
      <p><b>Clase A, B, C</b> por tienda: A son los productos que hacen el 80% de la venta de la tienda (en quetzales, 12 semanas), B el siguiente 15% y C el resto.</p>
      <p><b>Objetivo:</b> A = ${D.cfg.semanas_A} semanas de venta (mínimo ${D.cfg.minimo_A} piezas), B = ${D.cfg.semanas_B} semanas, C = reponer lo vendido en las últimas 4 semanas. El ritmo pesa más lo reciente (50% últimas 4 semanas, 30% las 4 anteriores, 20% las 4 anteriores).</p>
      <p><b>Sugerido</b> = objetivo − lo que hay en la tienda − lo que ya va en camino. Si la bodega no alcanza, se reparte primero a las A y a la tienda con menos semanas de cobertura.</p>
      <p><b>Oportunidades:</b> lo más vendido en la cadena, que hay en bodega y esta tienda no tiene ni ha vendido. Márcalas para agregarlas al pedido.</p>
    </div></details></section>`;
  $("tienda").onchange = e => { T = e.target.value; lsSet("resurtido-tienda", T); cargarEd(); FIL = { q: "", clase: "", prov: "" }; pintar(); };
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { TAB = b.dataset.tab; lsSet("resurtido-tab", TAB); pintar(); });
  $("xls").onclick = excel;
  $("aprobar").onclick = () => aprobar([T]);
  pintarFiltros(); pintarVista();
}
function fechaLocal(v) { const d = new Date(v.replace(" ", "T") + "Z"); return isNaN(d) ? v : d.toLocaleString("es-GT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function pintarFiltros() {
  const f = $("filtros");
  if (["prov", "todas"].includes(TAB)) { f.innerHTML = ""; return; }
  const ids = new Set((TAB === "opo" ? S().o : TAB === "dev" ? S().d : S().l).map(x => P(x[0])[3]));
  const provs = [...ids].map(i => [i, D.prov[i]]).sort((a, b) => a[1].localeCompare(b[1]));
  f.innerHTML = `<input type="search" id="fq" placeholder="Buscar título, código o proveedor" value="${esc(FIL.q)}" style="flex:1 1 220px">
    ${["ped", "fal"].includes(TAB) ? `<select id="fc"><option value="">Todas las clases</option>${["A", "B", "C"].map(c => `<option ${FIL.clase === c ? "selected" : ""}>${c}</option>`).join("")}</select>` : ""}
    <select id="fp" style="max-width:260px"><option value="">Todos los proveedores</option>${provs.map(([i, n]) => `<option value="${i}" ${FIL.prov === String(i) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
    ${TAB === "ped" ? `<button type="button" class="ghost small-b" id="todos">Marcar todo</button><button type="button" class="ghost small-b" id="ninguno">Quitar todo</button>` : ""}`;
  let tq; $("fq").oninput = e => { clearTimeout(tq); tq = setTimeout(() => { FIL.q = e.target.value; pintarVista(); }, 200); };
  if ($("fc")) $("fc").onchange = e => { FIL.clase = e.target.value; pintarVista(); };
  $("fp").onchange = e => { FIL.prov = e.target.value; pintarVista(); };
  if ($("todos")) { $("todos").onclick = () => marcarVisibles(true); $("ninguno").onclick = () => marcarVisibles(false); }
}
function marcarVisibles(on) {
  for (const x of S().l) if (x[7] > 0 && pasa(x[0], x[1])) { ED[x[0]] = Object.assign(ED[x[0]] || {}, { on }); }
  guardarEd(); pintar();
}
const celdaProd = pid => { const p = P(pid); return `<td><div class="t">${esc(p[2])}${p[5] ? ' <span class="chip">bazar</span>' : ""}</div><div class="small"><span class="mono">${esc(p[1] || "")}${p[0] ? " · " + esc(p[0]) : ""}</span> · ${esc(prov(pid))}</div></td>`; };
const MAX = 600;
function pintarVista() {
  const v = $("vista"), s = S();
  if (TAB === "ped") {
    const ls = s.l.filter(x => x[7] > 0 && pasa(x[0], x[1]));
    v.innerHTML = tabla(["", "Producto", "Clase", "Vendió 4 sem.", "Vendió 12 sem.", "Tiene", "En camino", "Bodega", "Mandar"], ls.slice(0, MAX).map(x => {
      const e = ED[x[0]] || {}, on = e.on !== false, q = e.q != null ? e.q : x[7];
      return `<tr class="${on ? "" : "off"}"><td><input type="checkbox" data-on="${x[0]}" ${on ? "checked" : ""} aria-label="Incluir"></td>${celdaProd(x[0])}
        <td><span class="chip ${x[1]}">${x[1]}</span></td><td class="n">${x[2]}</td><td class="n">${x[3]}</td><td class="n">${x[4]}</td><td class="n">${x[5] || ""}</td><td class="n">${x[6]}</td>
        <td class="n"><input class="q" type="number" min="0" step="1" data-q="${x[0]}" value="${q}">${x[9] === 1 ? `<div class="small" title="${esc(MOT[1])}">pedía ${x[8]}</div>` : ""}</td></tr>`;
    }), ls.length);
    v.querySelectorAll("[data-on]").forEach(c => c.onchange = () => { const k = c.dataset.on; ED[k] = Object.assign(ED[k] || {}, { on: c.checked }); guardarEd(); pintar(); });
    v.querySelectorAll("[data-q]").forEach(i => i.onchange = () => { const k = i.dataset.q; ED[k] = Object.assign(ED[k] || {}, { q: Math.max(0, Math.round(+i.value || 0)), on: true }); guardarEd(); pintar(); });
  } else if (TAB === "opo") {
    const ls = s.o.filter(x => pasa(x[0]));
    v.innerHTML = `<p class="muted">Se venden bien en otras tiendas, hay en bodega y aquí no hay. Márcalas para agregarlas al pedido.</p>` +
      tabla(["", "Producto", "Vendió la cadena 12 sem.", "Es A en", "Bodega libre", "Mandar"], ls.slice(0, MAX).map(x => {
        const e = ED["o" + x[0]] || {}, on = !!e.on, q = e.q != null ? e.q : x[4];
        return `<tr class="${on ? "" : "off"}"><td><input type="checkbox" data-oo="${x[0]}" ${on ? "checked" : ""} aria-label="Agregar"></td>${celdaProd(x[0])}
          <td class="n">${fmt(x[1])}</td><td class="n">${x[2]} tiendas</td><td class="n">${x[3]}</td><td class="n"><input class="q" type="number" min="0" data-oq="${x[0]}" value="${q}"></td></tr>`;
      }), ls.length);
    v.querySelectorAll("[data-oo]").forEach(c => c.onchange = () => { const k = "o" + c.dataset.oo; ED[k] = Object.assign(ED[k] || {}, { on: c.checked }); guardarEd(); pintar(); });
    v.querySelectorAll("[data-oq]").forEach(i => i.onchange = () => { const k = "o" + i.dataset.oq; ED[k] = Object.assign(ED[k] || {}, { q: Math.max(0, Math.round(+i.value || 0)), on: true }); guardarEd(); pintar(); });
  } else if (TAB === "fal") {
    const ls = s.l.filter(x => x[9] === 2 && pasa(x[0], x[1]));
    v.innerHTML = `<p class="muted">Se venden en esta tienda y no hay en bodega. Sirve para compras y para pedir traslados de otras tiendas.</p>` +
      tabla(["Producto", "Clase", "Vendió 4 sem.", "Vendió 12 sem.", "Tiene", "Necesita"], ls.slice(0, MAX).map(x =>
        `<tr>${celdaProd(x[0])}<td><span class="chip ${x[1]}">${x[1]}</span></td><td class="n">${x[2]}</td><td class="n">${x[3]}</td><td class="n">${x[4]}</td><td class="n">${x[8]}</td></tr>`), ls.length);
  } else if (TAB === "dev") {
    const ls = s.d.filter(x => pasa(x[0]));
    v.innerHTML = `<p class="muted">Lo que esta tienda tiene sin ninguna venta en 12 semanas (y con más de 90 días en el sistema). Revisa si está en piso, si conviene moverlo a otra tienda o devolverlo al CEDIS.</p>` +
      tabla(["Producto", "Tiene", "Se vende en"], ls.slice(0, MAX).map(x => `<tr>${celdaProd(x[0])}<td class="n">${x[1]}</td><td class="small">${esc(seVendeEn(x[0]))}</td></tr>`), ls.length);
  } else if (TAB === "prov") {
    const loc = D.prs[T] || {};
    const filas = D.pr.slice(0, 300).map(r => {
      const [i, u, q, ext, exb, np] = r, st = u + ext ? Math.round(u / (u + ext) * 100) : 0, cob = u ? (ext / (u / 12)) : null, l = loc[String(i)] || [0, 0];
      return `<tr><td class="t">${esc(D.prov[i])}</td><td class="n">${fmt(u)}</td><td class="n">Q${fmt(q)}</td><td class="n">${fmt(l[0])}</td><td class="n">${fmt(ext)}</td><td class="n">${fmt(exb)}</td>
        <td class="n">${st}%</td><td class="n">${cob == null ? "—" : cob > 99 ? "+99" : cob.toFixed(1)}</td><td class="n hide-m">${fmt(np)}</td></tr>`;
    });
    v.innerHTML = `<p class="muted">Toda la cadena, últimas 12 semanas, ordenado por venta. <b>% vendido</b> = vendido ÷ (vendido + existencia en tiendas). <b>Semanas de cobertura</b> = existencia en tiendas ÷ venta semanal: más de 12 indica exceso, menos de 3 indica que hace falta mandar.</p>` +
      tabla(["Proveedor / editorial", "Uds. cadena", "Venta cadena", "Uds. " + T, "Exist. tiendas", "Exist. bodega", "% vendido", "Sem. cobertura", "Productos vendidos"], filas, D.pr.length);
  } else {
    const filas = D.tiendas.map(t => {
      const s2 = D.s[t], tp = totPedido(t), uds = tp.uds, lin = tp.lineas;
      return `<tr><td><input type="checkbox" data-sel="${t}" ${SEL.has(t) ? "checked" : ""} ${uds ? "" : "disabled"} aria-label="Marcar ${t}"></td><td class="t"><a href="#" data-ir="${t}">${esc(t)}</a> <span class="small">${esc(D.nombres[t] || "")}</span></td><td class="n">${fmt(uds)}</td><td class="n">${fmt(lin)}</td>
        <td class="n">${fmt(s2.agA)} de ${fmt(s2.nA)}</td><td class="n">${fmt(s2.l.filter(x => x[9] === 2).length)}</td><td class="n">${fmt(s2.d.reduce((a, x) => a + x[1], 0))}</td><td>${D.bor[t] ? esc(D.bor[t].nombre) : ""}</td></tr>`;
    });
    v.innerHTML = `<p class="muted">Marca las tiendas que se surten juntas y apruébalas de una vez. En Despachos, el CEDIS las recoge en un solo recorrido ("Surtir varias tiendas") y después reparte por tienda.</p>
      <div class="row"><button type="button" class="ghost small-b" id="selTodas">Marcar todas</button><button type="button" class="ghost small-b" id="selNinguna">Quitar todas</button>
      <button type="button" id="aprVarias" ${SEL.size ? "" : "disabled"}>Aprobar ${SEL.size} ${SEL.size === 1 ? "tienda" : "tiendas"} · ${fmt([...SEL].reduce((a, t) => a + totPedido(t).uds, 0))} uds.</button></div>` +
      tabla(["", "Tienda", "Uds. a mandar", "Productos", "A agotados", "Faltan en bodega", "Para devolver", "Borrador"], filas, filas.length);
    v.querySelectorAll("[data-sel]").forEach(c => c.onchange = () => { c.checked ? SEL.add(c.dataset.sel) : SEL.delete(c.dataset.sel); pintarVista(); });
    $("selTodas").onclick = () => { D.tiendas.forEach(t => { if (totPedido(t).uds) SEL.add(t); }); pintarVista(); };
    $("selNinguna").onclick = () => { SEL.clear(); pintarVista(); };
    $("aprVarias").onclick = () => aprobar([...SEL]);
    v.querySelectorAll("[data-ir]").forEach(a => a.onclick = e => { e.preventDefault(); T = a.dataset.ir; lsSet("resurtido-tienda", T); cargarEd(); TAB = "ped"; pintar(); window.scrollTo({ top: 0 }); });
  }
}
function tabla(cab, filas, total) {
  return `<div class="tbl"><table><thead><tr>${cab.map((c, i) => `<th class="${i > 1 && !["Clase", "Se vende en", "Borrador"].includes(c) ? "n" : ""}">${esc(c)}</th>`).join("")}</tr></thead><tbody>
    ${filas.join("") || `<tr><td colspan="${cab.length}" class="muted">Nada que mostrar.</td></tr>`}</tbody></table></div>
    ${total > filas.length ? `<p class="small">Se muestran ${fmt(filas.length)} de ${fmt(total)}. Usa los filtros o el Excel para ver todo.</p>` : ""}`;
}
function seVendeEn(pid) {
  const out = [];
  for (const t of D.tiendas) { if (t === T) continue; const x = D.s[t].l.find(y => y[0] === pid); if (x) out.push(t); }
  return out.join(", ") || "—";
}

// ---------------------------------------------------------------- Excel
function excel() {
  const s = S(), wb = XLSX.utils.book_new();
  const fp = pid => { const p = P(pid); return { "Código": p[0], "Referencia": p[1], "Producto": p[2], "Proveedor": prov(pid), "Precio": p[4] }; };
  const add = (n, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ "": "Sin datos" }]), n);
  add("Pedido", lineasPedido().filter(l => l.q > 0).map(l => Object.assign(fp(l.pid), { "Tipo": l.tipo === "opo" ? "Oportunidad" : "Sugerido", "Clase": l.tipo === "opo" ? "" : l.x[1], "Mandar": l.q })));
  add("Sugerido completo", s.l.map(x => Object.assign(fp(x[0]), { "Clase": x[1], "Vendió 4 sem.": x[2], "Vendió 12 sem.": x[3], "Tiene": x[4], "En camino": x[5], "Bodega": x[6], "Necesita": x[8], "Asignado": x[7], "Nota": MOT[x[9]] })));
  add("Oportunidades", s.o.map(x => Object.assign(fp(x[0]), { "Vendió la cadena 12 sem.": x[1], "Es A en (tiendas)": x[2], "Bodega libre": x[3], "Sugerido": x[4] })));
  add("Para devolver", s.d.map(x => Object.assign(fp(x[0]), { "Tiene": x[1] })));
  const loc = D.prs[T] || {};
  add("Proveedores", D.pr.map(([i, u, q, ext, exb, np]) => ({ "Proveedor": D.prov[i], "Uds. cadena 12 sem.": u, "Venta cadena Q": q, ["Uds. " + T]: (loc[String(i)] || [0])[0], "Existencia tiendas": ext, "Existencia bodega": exb, "% vendido": u + ext ? Math.round(u / (u + ext) * 100) : 0, "Productos vendidos": np })));
  XLSX.writeFile(wb, `Resurtido_${T}_${D.v.slice(0, 10)}.xlsx`);
}

// ---------------------------------------------------------------- aprobar: crea el pedido en el sistema (vía el servidor de Despachos)
const CFG = () => lsGet("despacho-cfg", null), OP = () => lsGet("despacho-op", null);
async function api(accion, datos, op) {
  const c = CFG();
  const body = JSON.stringify(Object.assign({ accion, token: c.token, operador: op }, datos || {}));
  let r;
  try { r = await fetch(c.url + (c.url.includes("?") ? "&" : "?") + "q=" + encodeURIComponent(body), { method: "GET", redirect: "follow" }); }
  catch (e) { throw new Error("No hay conexión con el servidor. Revisa el internet."); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "Error del servidor");
  return j.datos;
}
function dialogo(html) { $("dlgForm").innerHTML = html; const d = $("dlg"); try { d.showModal(); } catch (e) { d.setAttribute("open", ""); } return d; }
async function enviarPedido(t, ls, cod, estado) {
  const partes = []; for (let i = 0; i < ls.length; i += 120) partes.push(ls.slice(i, i + 120).map(l => [l.pid, l.q]));
  let pedido = 0;
  for (let i = 0; i < partes.length; i++) {
    estado(`${t}: enviando parte ${i + 1} de ${partes.length}…`);
    const r = await api("resurtido", pedido ? { pedido, lineas: partes[i], tienda: t } : { tienda: t, borrador: D.bor[t] ? D.bor[t].id : 0, lineas: partes[i] }, cod);
    pedido = r.pedido;
  }
  estado(`${t}: confirmando…`);
  return (await api("resurtido", { pedido, fin: true, tienda: t }, cod)).nombre;
}
function aprobar(tiendas) {
  if (!CFG()) {
    dialogo(`<h2>Falta conectar el servidor</h2><p class="muted">Para crear pedidos se usa el mismo servidor de la app de Despachos. Abre <a href="../despacho/">Despachos</a> en este equipo, configúralo una vez y regresa.</p><div class="row" style="justify-content:flex-end"><button type="submit">Entendido</button></div>`);
    return;
  }
  const plan = tiendas.map(t => ({ t, ls: lineasPedido(t).filter(l => l.q > 0) })).filter(x => x.ls.length);
  if (!plan.length) return;
  const tot = plan.reduce((s, x) => s + x.ls.reduce((a, l) => a + l.q, 0), 0), op = OP();
  const d = dialogo(`<h2>Aprobar ${plan.length === 1 ? "pedido para " + esc(plan[0].t) : plan.length + " pedidos"}</h2>
    <p>${fmt(tot)} unidades de ${esc(D.origen)} a ${plan.map(x => esc(x.t)).join(", ")}. Quedan listos para empacar en Despachos${plan.length > 1 ? " (con \"Surtir varias tiendas\" se recogen juntos)" : ""}.</p>
    <label class="small" style="font-weight:700;display:grid;gap:4px">Tu código de supervisor<input id="opCod" value="${esc(op && op.rol === "SUPERVISOR" ? op.codigo : "")}" autocomplete="off" style="text-transform:uppercase"></label>
    <p class="notice bad" id="apErr" hidden></p><p class="small" id="apEst"></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="ghost" id="apNo">Cancelar</button><button type="submit" id="apSi">Aprobar</button></div>`);
  $("apNo").onclick = () => d.close();
  $("dlgForm").onsubmit = async e => {
    e.preventDefault();
    const cod = $("opCod").value.trim().toUpperCase();
    if (!cod) return;
    $("apSi").disabled = true; $("apErr").hidden = true;
    let yo;
    try { yo = await api("login", { codigo: cod }, cod); if (yo.rol !== "SUPERVISOR") throw new Error("Solo un supervisor puede aprobar pedidos."); }
    catch (er) { $("apErr").textContent = er.message; $("apErr").hidden = false; $("apSi").disabled = false; return; }
    const hechos = [], fallos = [];
    for (const x of plan) {
      try {
        const nombre = await enviarPedido(x.t, x.ls, cod, m => $("apEst").textContent = m);
        hechos.push({ t: x.t, nombre, uds: x.ls.reduce((a, l) => a + l.q, 0) });
        lsDel(`resurtido-ed-${x.t}-${D.v}`); delete D.bor[x.t]; SEL.delete(x.t);
        if (x.t === T) ED = {};
      } catch (er) { fallos.push(`${x.t}: ${er.message}`); }
    }
    d.close();
    dialogo(`<h2>${hechos.length ? "Pedidos creados ✓" : "No se pudo crear"}</h2>
      ${hechos.length ? `<div class="tbl"><table><tbody>${hechos.map(h => `<tr><td class="t">${esc(h.t)}</td><td class="mono">${esc(h.nombre)}</td><td class="n">${fmt(h.uds)} uds.</td></tr>`).join("")}</tbody></table></div>
        <p class="muted">Ya aparecen en Despachos. ${hechos.length > 1 ? "Usa \"Surtir varias tiendas a la vez\" para recogerlos en un solo recorrido y repartir por tienda." : ""} Lo aprobado cuenta como "en camino" en el cálculo de mañana.</p>` : ""}
      ${fallos.length ? `<p class="notice bad">${fallos.map(esc).join("<br>")}</p>` : ""}
      <div class="row" style="justify-content:flex-end"><button type="submit">Listo</button></div>`);
    $("dlgForm").onsubmit = ev => { ev.preventDefault(); $("dlg").close(); pintar(); };
  };
}
</script>
