<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Checador De Museo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700;6..96,900&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banda azul De Museo con logo arriba, campo de búsqueda, ficha de producto tipo cartel de museo, historial al pie */
:root {
  --navy: #112369;        /* Pantone 2757 C */
  --navy-deep: #0b1748;
  --on-navy: #ffffff;
  --bg: #f3f4f9;
  --surface: #ffffff;
  --ink: #111a3d;
  --muted: #5b6386;
  --line: #d9dcea;
  --gold: #f2bd3c;
  --gold-ink: #0b1748;
  --sale-bg: #d62818;
  --on-sale: #ffffff;
  --sale: #c4271b;
  --soft: #e9ecf6;
  --f-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #1a2f85; --navy-deep: #0b1748; --on-navy: #ffffff;
    --bg: #080e26; --surface: #111a3d; --ink: #edf0fa; --muted: #9da6c9; --line: #26315e;
    --gold: #f2bd3c; --gold-ink: #0b1748; --sale-bg: #e3392a; --on-sale: #ffffff; --sale: #ff7a6b; --soft: #18224c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --navy: #1a2f85; --navy-deep: #0b1748; --on-navy: #ffffff;
  --bg: #080e26; --surface: #111a3d; --ink: #edf0fa; --muted: #9da6c9; --line: #26315e;
  --gold: #f2bd3c; --gold-ink: #0b1748; --sale-bg: #e3392a; --on-sale: #ffffff; --sale: #ff7a6b; --soft: #18224c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 760px; margin: 0 auto; }

/* Encabezado de marca */
.mast { background: var(--navy-deep); color: var(--on-navy); padding-block: 22px 0; }
.mast .inner { display: grid; gap: 14px; }
.mast-top { display: flex; justify-content: space-between; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.logo { display: block; width: min(320px, 72vw); height: auto; }
.tagline { font-family: var(--f-display); font-style: italic; font-size: 17px; opacity: .85; }
.ribbon { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 10px 16px; margin-bottom: -22px; position: relative; z-index: 1;
  background: var(--sale-bg); color: var(--on-sale); border-radius: 6px; box-shadow: 0 6px 18px rgba(11,23,72,.28); }
.ribbon-t { font-family: var(--f-display); font-weight: 900; font-size: clamp(20px, 4.6vw, 28px); line-height: 1.05; letter-spacing: .01em; }
.ribbon-t b { color: var(--gold); }
.ribbon-s { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

main.pad { padding-block: 44px 48px; }
main .inner { display: grid; gap: 22px; }

form.scan { display: grid; gap: 8px; }
.scan-head { display: flex; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; align-items: baseline; }
label[for="codigo"] { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scan-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
button.snd { padding: 3px 10px; font-size: 12px; font-weight: 700; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; }
button.snd[aria-pressed="true"] { color: var(--navy); border-color: var(--navy); }
:root:not([data-theme="light"]) button.snd[aria-pressed="true"] { color: var(--ink); }
:root[data-theme="light"] button.snd[aria-pressed="true"] { color: var(--navy); }
.field { display: flex; gap: 8px; }
#codigo { flex: 1; min-width: 0; font-family: var(--f-mono); font-size: clamp(19px, 4.4vw, 26px); letter-spacing: .05em; padding: 14px 16px;
  border: 2px solid var(--navy); border-radius: 6px; background: var(--surface); color: var(--ink); }
#codigo:focus { outline: 3px solid var(--gold); outline-offset: 2px; }
button { font: 700 16px var(--f-body); border-radius: 6px; cursor: pointer; padding: 0 20px; background: var(--navy); color: var(--on-navy); border: 2px solid var(--navy); }
button:hover { filter: brightness(1.15); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

.result { border-radius: 10px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.result.flash { animation: pop .28s ease-out; }
@keyframes pop { from { transform: scale(.985); } to { transform: scale(1); } }

.idle, .loading { padding: 22px 20px; color: var(--muted); font-size: 15px; display: grid; gap: 8px; }
.idle code { font-family: var(--f-mono); background: var(--soft); padding: 1px 6px; border-radius: 4px; color: var(--ink); cursor: pointer; }
.bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--navy); transition: width .2s; }

/* Ficha común */
.band { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; padding: 10px 20px; }
.band-t { font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: .01em; }
.band-c { font-family: var(--f-mono); font-size: 13px; opacity: .9; }
.desc { padding: 18px 20px 16px; }
.desc h2 { margin: 0 0 6px; font-size: clamp(19px, 4vw, 24px); line-height: 1.2; font-weight: 700; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--muted); }
.meta b { font-weight: 600; color: var(--ink); }

/* Oferta bazar */
.band.sale { background: var(--sale-bg); color: var(--on-sale); }
.hero { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 20px 22px; background: var(--gold); color: var(--gold-ink); overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent 0 22px, rgba(255,255,255,.2) 22px 44px); pointer-events: none; }
.now { position: relative; display: grid; gap: 6px; min-width: 0; }
.now-l { font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.now-a { font-family: var(--f-display); font-weight: 900; font-size: clamp(76px, 19vw, 128px); line-height: .85; font-variant-numeric: lining-nums; }
.now-a small { font-size: .42em; vertical-align: .95em; margin-right: 4px; }
.was { font-size: 17px; font-weight: 600; }
.was s { text-decoration-thickness: 2.5px; text-decoration-color: var(--sale-bg); }
.burst { position: relative; flex: none; width: clamp(104px, 26vw, 140px); aspect-ratio: 1; max-width: 100%;
  display: grid; place-content: center; gap: 2px; text-align: center; background: var(--sale-bg); color: var(--on-sale); transform: rotate(12deg);
  clip-path: polygon(50.0% 0.0%, 59.3% 9.1%, 71.7% 5.0%, 76.2% 17.2%, 89.1% 18.8%, 87.8% 31.8%, 98.7% 38.9%, 92.0% 50.0%, 98.7% 61.1%, 87.8% 68.2%, 89.1% 81.2%, 76.2% 82.8%, 71.7% 95.0%, 59.3% 90.9%, 50.0% 100.0%, 40.7% 90.9%, 28.3% 95.0%, 23.8% 82.8%, 10.9% 81.2%, 12.2% 68.2%, 1.3% 61.1%, 8.0% 50.0%, 1.3% 38.9%, 12.2% 31.8%, 10.9% 18.8%, 23.8% 17.2%, 28.3% 5.0%, 40.7% 9.1%); }
.burst b { font-family: var(--f-body); font-weight: 800; font-size: clamp(26px, 6.6vw, 36px); line-height: .9; }
.burst span { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.savebar { padding: 14px 20px; text-align: center; font-size: 18px; font-weight: 600; background: var(--navy-deep); color: var(--on-navy); }
.savebar strong { font-family: var(--f-display); font-weight: 900; font-size: 1.45em; color: var(--gold); }
.savebar .legal { display: block; margin-top: 4px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.advice .legal-s { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

/* Precio normal */
.band.reg { background: var(--navy); color: var(--on-navy); }
.reg-price { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; padding: 4px 20px 20px; }
.reg-price .lbl { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
.reg-price .amt { font-family: var(--f-display); font-weight: 900; font-size: clamp(60px, 15vw, 96px); line-height: .85; color: var(--navy); }
.reg-price .amt small { font-size: .42em; vertical-align: .95em; margin-right: 4px; }
.reg-note { font-size: 15px; font-weight: 600; color: var(--muted); max-width: 30ch; }
.advice { background: var(--soft); padding: 18px 20px 20px; display: grid; gap: 12px; border-top: 1px solid var(--line); }
.advice h3 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(21px, 4.6vw, 27px); line-height: 1.15; color: var(--ink); text-wrap: balance; }
.advice h3 em { font-style: normal; background: var(--sale-bg); color: var(--on-sale); padding: 0 .2em; }
.advice p { margin: 0; font-size: 14px; color: var(--muted); }
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pick { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px; cursor: pointer; position: relative; }
.pick:hover { border-color: var(--navy); }
.pick:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.pick .pp { font-size: 11px; font-weight: 800; letter-spacing: .06em; justify-self: start; background: var(--sale-bg); color: var(--on-sale); padding: 2px 7px; border-radius: 3px; }
.pick .pt { font-size: 14px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pick .pr { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pick .pr b { font-family: var(--f-display); font-weight: 900; font-size: 26px; line-height: 1; background: var(--gold); color: var(--gold-ink); padding: 2px 7px; border-radius: 4px; }
.pick .pr s { font-size: 13px; color: var(--muted); text-decoration-color: var(--sale-bg); }

/* Sin precio / no encontrado */
.miss { padding: 26px 22px; background: var(--soft); display: grid; gap: 10px; }
.miss .chip { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.miss h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(22px, 4.8vw, 30px); line-height: 1.15; text-wrap: balance; }
.miss p { margin: 0; font-size: 15px; }

/* Lista de resultados */
.list-top { display: flex; justify-content: space-between; gap: 6px 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.list-top b { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.matches { list-style: none; margin: 0; padding: 0; max-height: 62vh; overflow-y: auto; }
.matches li { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); cursor: pointer; }
.matches li:last-child { border-bottom: 0; }
.matches li:hover, .matches li:focus-visible { background: var(--soft); outline: none; }
.matches .mt { font-weight: 600; min-width: 0; }
.matches .ms { grid-column: 1; font-size: 13px; color: var(--muted); min-width: 0; }
.matches .mono { font-family: var(--f-mono); }
.matches .mp { grid-row: 1 / span 2; grid-column: 2; text-align: right; align-self: center; display: grid; justify-items: end; gap: 2px; }
.matches .mp em { font-style: normal; font-size: 11px; font-weight: 800; background: var(--sale-bg); color: var(--on-sale); padding: 1px 6px; border-radius: 3px; }
.matches .mp b { font-family: var(--f-display); font-weight: 900; font-size: 24px; line-height: 1; padding: 3px 8px; border-radius: 4px; }
.matches .sale .mp b { background: var(--gold); color: var(--gold-ink); }
.matches .mp s { font-size: 13px; color: var(--muted); text-decoration-color: var(--sale-bg); }
.matches .mp .n { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
mark { background: var(--gold); color: var(--gold-ink); padding: 0 1px; border-radius: 2px; }

/* Historial */
.history h3 { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.history ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.history li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.history li:hover .t { text-decoration: underline; }
.history .c { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.history .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history .p { font-weight: 700; font-variant-numeric: tabular-nums; }
.history .p.s { color: var(--sale); }

.result.flash .now-a { animation: slam .42s cubic-bezier(.2,1.6,.4,1); }
.result.flash .burst { animation: spin .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes slam { from { transform: scale(.7); } to { transform: scale(1); } }
@keyframes spin { from { transform: rotate(-40deg) scale(.5); } to { transform: rotate(12deg) scale(1); } }
@media (prefers-reduced-motion: reduce) { .result.flash, .result.flash .now-a, .result.flash .burst { animation: none; } }

@media (max-width: 560px) {
  .picks { grid-template-columns: 1fr; }
  .pick { grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-items: center; }
  .pick .pt { grid-column: 1 / -1; }
}
@media (max-width: 420px) {
  .hero { padding-inline: 16px; }
  .savebar { font-size: 16px; }
  button { padding: 0 14px; }
}
</style>

<header class="mast pad">
  <div class="inner">
    <div class="mast-top">
      <img class="logo" src="logo.png" alt="De Museo" width="800" height="144">
      <span class="tagline">Un mundo por descubrir</span>
    </div>
    <div class="ribbon">
      <span class="ribbon-t" id="ribbonT">Bazar de Descuentos</span>
      <span class="ribbon-s">Válido solo en tiendas físicas</span>
    </div>
  </div>
</header>

<main class="pad">
  <div class="inner">
    <form class="scan" id="scanForm" autocomplete="off">
      <div class="scan-head">
        <label for="codigo">Código de barras, referencia interna o nombre</label>
        <span class="scan-tools"><span class="count" id="count"></span><button type="button" class="snd" id="snd" aria-pressed="true">🔊 Sonido</button></span>
      </div>
      <div class="field">
        <input id="codigo" name="codigo" placeholder="Escanea o escribe aquí" autofocus spellcheck="false">
        <button type="submit" id="buscar">Buscar</button>
      </div>
      <p class="hint">Escanea el código, escribe la referencia interna y presiona Enter, o escribe parte del título o del autor.</p>
    </form>

    <section class="result" id="result" aria-live="polite">
      <div class="loading"><span id="loadMsg">Cargando ofertas del Bazar…</span><div class="bar"><i id="loadBar"></i></div></div>
    </section>

    <section class="history" id="history" hidden>
      <h3>Últimas consultas</h3>
      <ol id="histList"></ol>
    </section>
  </div>
</main>

<script>
// Producto: [código, referencia, título, autor, editorial, precio, tema, precioBazar?, %descuento?]
// Carga por partes: los códigos y referencias se buscan en archivos pequeños (c/NN.json, r/NN.json);
// las ofertas del bazar llegan primero (bazar.json); el catálogo completo para buscar por nombre se descarga
// en segundo plano y se guarda en el equipo para que la próxima vez abra al instante.
let CAT_V = "", MAXPCT = 75;
const num = n => Math.round(n).toLocaleString("es-GT", { maximumFractionDigits: 0 });
const fmt = n => "Q" + num(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
const $ = id => document.getElementById(id);
const input = $("codigo"), result = $("result");
const isBz = p => p.length > 7 && p[7] != null;
const history = [];
const REG = []; // productos mostrados en pantalla (data-i apunta aquí)
const reg = p => { REG.push(p); return REG.length - 1; };

let BZ = [], TEMA_BZ = new Map(), TOTAL = 0, bzReady = false;
let CAT = null, TXT = null, catPct = 0, pendingName = null;
const shardCache = new Map();
const key2 = s => s.slice(-2).padStart(2, "0");

function shard(kind, k) {
  const id = kind + "/" + k;
  if (!shardCache.has(id)) shardCache.set(id, fetch(id + ".json?v=" + encodeURIComponent(CAT_V)).then(r => { if (!r.ok) throw 0; return r.json(); }).catch(e => { shardCache.delete(id); throw e; }));
  return shardCache.get(id);
}

async function loadBazar() {
  const d = await (await fetch("bazar.json?t=" + Date.now(), { cache: "no-store" })).json();
  BZ = d.bz; TOTAL = d.total; CAT_V = d.v || String(TOTAL);
  // Porcentajes vigentes según las categorías de Odoo (ej. 60%, 75%, 90%)
  const pcts = [...new Set(BZ.map(p => p[8]))].sort((a, b) => a - b);
  MAXPCT = pcts.length ? pcts[pcts.length - 1] : 0;
  const list = pcts.map(x => `<b>${x}%</b>`);
  $("ribbonT").innerHTML = "Bazar de Descuentos " + (list.length > 1 ? list.slice(0, -1).join(", ") + " y " + list[list.length - 1] : list.join(""));
  for (const p of BZ) if (p[6]) { if (!TEMA_BZ.has(p[6])) TEMA_BZ.set(p[6], []); TEMA_BZ.get(p[6]).push(p); }
  bzReady = true;
  $("count").textContent = TOTAL.toLocaleString("es-GT") + " productos · " + BZ.length.toLocaleString("es-GT") + " en bazar" + (d.v ? " · Actualizado desde Odoo: " + fechaLocal(d.v) : "");
  if (!input.value.trim()) showIdle();
}

// --- Caché local (IndexedDB) del catálogo para búsquedas por nombre ---
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open("demuseo-checador", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }

async function loadCatalog() {
  let text = null;
  try { const c = await idbGet("catalogo"); if (c && c.v === CAT_V) text = c.text; } catch (e) {}
  if (!text) {
    const r = await fetch("catalogo.json?v=" + encodeURIComponent(CAT_V));
    if (!r.ok) throw 0;
    const total = 10.4e6; let got = 0;
    const counted = r.body.pipeThrough(new TransformStream({ transform(ch, c) { got += ch.length; catPct = Math.min(99, Math.round(got / total * 100)); paintPending(); c.enqueue(ch); } }));
    text = await new Response(counted).text();
    try { await idbSet("catalogo", { v: CAT_V, text }); } catch (e) {}
  }
  const d = JSON.parse(text);
  const A = d.a, E = d.e, T = d.t;
  CAT = d.p.map(r => { const p = [r[0], r[1], r[2], A[r[3]], E[r[4]], r[5], T[r[6]]]; if (r.length > 7) p.push(r[7], r[8]); return p; });
  TXT = CAT.map(p => norm(p[2] + " " + p[3] + " " + p[4] + " " + p[1]));
  catPct = 100;
  if (pendingName != null) { const q = pendingName; pendingName = null; if (input.value.trim() === q) search(q, false); }
}

// Fecha de la última sincronización (viene en UTC) en hora de Guatemala
function fechaLocal(v) {
  const d = new Date(v.replace(" ", "T") + ":00Z");
  return isNaN(d) ? v : d.toLocaleString("es-GT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
const bazarReady = loadBazar();
bazarReady.catch(() => { result.innerHTML = `<div class="loading">No se pudo cargar. Revisa la conexión a internet y recarga la página.</div>`; });
// El catálogo completo se pide después de que la página ya está lista
bazarReady.then(() => setTimeout(() => loadCatalog().catch(() => {}), 400)).catch(() => {});

async function byDigits(d) {
  try { await bazarReady; } catch (e) {} // la versión de los datos llega con bazar.json
  const tries = [...new Set([d, d.replace(/^0+/, ""), "0" + d])].filter(Boolean);
  for (const t of tries) { const s = await shard("c", key2(t)); if (s[t]) return s[t]; }
  for (const t of tries) { const s = await shard("r", key2(t)); if (s[t]) return s[t]; }
  return null;
}

function byName(q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const out = [];
  for (let i = 0; i < TXT.length; i++) { const t = TXT[i]; if (words.every(w => t.includes(w))) out.push(i); }
  const w0 = words[0];
  const score = i => (isBz(CAT[i]) ? 2 : 0) + (TXT[i].startsWith(w0) ? 1 : 0);
  out.sort((a, b) => score(b) - score(a) || CAT[a][2].localeCompare(CAT[b][2], "es"));
  return out.map(i => CAT[i]);
}

function highlight(text, q) {
  const words = norm(q).split(/\s+/).filter(w => w.length > 1);
  const src = String(text), n = norm(src);
  if (n.length !== src.length) return esc(src);
  const marks = new Array(src.length).fill(false);
  for (const w of words) { let i = n.indexOf(w); while (i > -1) { for (let k = i; k < i + w.length; k++) marks[k] = true; i = n.indexOf(w, i + w.length); } }
  let html = "", open = false;
  for (let i = 0; i < src.length; i++) {
    if (marks[i] && !open) { html += "<mark>"; open = true; }
    if (!marks[i] && open) { html += "</mark>"; open = false; }
    html += esc(src[i]);
  }
  return html + (open ? "</mark>" : "");
}

function flash() { result.classList.remove("flash"); void result.offsetWidth; result.classList.add("flash"); }

function showIdle() {
  if (!bzReady) return;
  const b = BZ[0];
  result.innerHTML = `<div class="idle">
    <span>Escanea un producto o búscalo para ver su precio. Si está en el Bazar de Descuentos, verás su precio de oferta.</span>
    <span>Prueba: libro en bazar <code data-q="${esc(b[0])}">${esc(b[0])}</code>, precio normal <code data-q="9788427212589">9788427212589</code> o nombre <code data-q="garcia marquez">garcia marquez</code></span>
  </div>`;
}

function paintPending() {
  if (pendingName == null) return;
  result.innerHTML = `<div class="loading"><span>Preparando la búsqueda por nombre… ${catPct}%. Mientras tanto, puedes escanear códigos o escribir referencias.</span><div class="bar"><i style="width:${catPct}%"></i></div></div>`;
}

const idLine = p => `${esc(p[0] || "Sin código")}${p[1] ? " · Ref. " + esc(p[1]) : ""}`;
const descBlock = p => `
  <div class="desc">
    <h2>${esc(p[2])}</h2>
    <div class="meta">
      ${p[3] ? `<span>Autor: <b>${esc(p[3])}</b></span>` : ""}
      ${p[4] ? `<span>Editorial: <b>${esc(p[4])}</b></span>` : ""}
      ${p[6] ? `<span>Tema: <b>${esc(p[6])}</b></span>` : ""}
    </div>
  </div>`;

function picksFor(p) {
  let pool = (p[6] && TEMA_BZ.get(p[6])) || [];
  let from = pool.length ? "tema" : "";
  if (!pool.length) { pool = BZ.filter(b => b[4] && b[4] === p[4]); from = pool.length ? "editorial" : ""; }
  if (!pool.length) pool = BZ;
  // Selección variada pero estable para cada producto
  let h = 0; for (const ch of String(p[0] || p[1])) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const out = [];
  for (let k = 0; out.length < 3 && k < pool.length * 2; k++) {
    const b = pool[(h + k * 7919) % pool.length];
    if (b[0] !== p[0] && !out.includes(b)) out.push(b);
  }
  return { out, from };
}

function showItem(p) {
  flash();
  if (isBz(p)) {
    chime();
    const [, , , , , precio, , bazar, pct] = p;
    result.innerHTML = `
      <div class="band sale"><span class="band-t">¡Oferta Bazar!</span><span class="band-c">${idLine(p)}</span></div>
      ${descBlock(p)}
      <div class="hero">
        <div class="now">
          <span class="now-l">Precio bazar</span>
          <span class="now-a"><small>Q</small>${num(bazar)}</span>
          <span class="was">Antes <s>${fmt(precio)}</s></span>
        </div>
        <div class="burst" aria-label="${pct}% de descuento"><b>−${pct}%</b><span>descuento</span></div>
      </div>
      <div class="savebar">¡Te ahorras <strong>${fmt(precio - bazar)}</strong> en este libro!<span class="legal">Válido solo en tiendas físicas</span></div>`;
  } else if (!p[5]) {
    result.innerHTML = `
      <div class="band reg"><span class="band-t">Precio por confirmar</span><span class="band-c">${idLine(p)}</span></div>
      ${descBlock(p)}
      <div class="miss"><h2>Consulta el precio de este artículo en caja.</h2><p>Este producto no tiene precio registrado en el sistema.</p></div>`;
  } else {
    softChime();
    const { out, from } = bzReady ? picksFor(p) : { out: [], from: "" };
    const temaTxt = from === "tema" ? `en ${esc(p[6].toLowerCase())}` : from === "editorial" ? `de ${esc(p[4])}` : "para ti";
    result.innerHTML = `
      <div class="band reg"><span class="band-t">Precio normal</span><span class="band-c">${idLine(p)}</span></div>
      ${descBlock(p)}
      <div class="reg-price">
        <div><span class="lbl">Precio</span><span class="amt"><small>Q</small>${num(p[5])}</span></div>
        <span class="reg-note">Este artículo está a precio normal. No forma parte del Bazar de Descuentos.</span>
      </div>
      ${out.length ? `<div class="advice">
        <h3>Te aconsejamos estas ofertas del bazar ${temaTxt}, con <em>hasta ${MAXPCT}% de descuento</em></h3>
        <p class="legal-s">Ofertas válidas solo en tiendas físicas.</p>
        <div class="picks">${out.map(b => `
          <button type="button" class="pick" data-i="${reg(b)}">
            <span class="pp">−${b[8]}%</span>
            <span class="pt">${esc(b[2])}</span>
            <span class="pr"><b>${fmt(b[7])}</b><s>${fmt(b[5])}</s></span>
          </button>`).join("")}</div>
      </div>` : ""}`;
  }
  addHistory(p[0] || p[1], p);
}

function showMiss(q, kind) {
  flash();
  result.innerHTML = `
    <div class="band reg"><span class="band-t">Sin resultados</span><span class="band-c">${esc(kind)} ${esc(q)}</span></div>
    <div class="miss">
      <h2>No encontramos este artículo en el inventario de De Museo.</h2>
      <p>${kind === "Búsqueda" ? "Revisa la ortografía o prueba con menos palabras." : "Revisa que el código o la referencia estén completos, o consulta en caja."}</p>
    </div>`;
  addHistory(q, null);
}

const MAX = 60;
function showList(ps, q) {
  const nb = ps.filter(isBz).length;
  result.innerHTML = `
    <div class="list-top"><b>${ps.length.toLocaleString("es-GT")} ${ps.length === 1 ? "resultado" : "resultados"} para “${esc(q)}”</b>
      <span>${nb ? `${nb.toLocaleString("es-GT")} en bazar, primero en la lista` : "Ninguno en bazar"}${ps.length > MAX ? ` · mostrando ${MAX}, agrega palabras para afinar` : ""}</span></div>
    <ol class="matches">${ps.slice(0, MAX).map(p => { const s = isBz(p); return `
      <li tabindex="0" data-i="${reg(p)}" class="${s ? "sale" : ""}">
        <span class="mt">${highlight(p[2], q)}</span>
        <span class="ms">${highlight([p[3], p[4]].filter(Boolean).join(" · "), q)}${p[0] ? ` · <span class="mono">${esc(p[0])}</span>` : ""}${p[1] ? ` · Ref. <span class="mono">${esc(p[1])}</span>` : ""}</span>
        <span class="mp">${s ? `<em>−${p[8]}% bazar</em><b>${fmt(p[7])}</b><s>${fmt(p[5])}</s>` : `<b>${p[5] ? fmt(p[5]) : "—"}</b><span class="n">Precio normal</span>`}</span>
      </li>`; }).join("")}</ol>`;
}

let seq = 0;
async function search(raw, fromEnter) {
  const q = raw.trim();
  const my = ++seq;
  if (!q) { showIdle(); return; }
  if (/^[\d\s-]+$/.test(q)) {
    const d = q.replace(/\D/g, "");
    let p = null;
    try { p = await byDigits(d); }
    catch (e) { if (my === seq) result.innerHTML = `<div class="loading">No se pudo consultar. Revisa la conexión a internet e intenta de nuevo.</div>`; return; }
    if (my !== seq) return;
    if (p) showItem(p); else showMiss(d, d.length >= 8 ? "Código" : "Referencia");
    if (fromEnter) input.select();
    return;
  }
  if (!TXT) { pendingName = q; paintPending(); return; }
  const ps = byName(q);
  if (!ps.length) { showMiss(q, "Búsqueda"); return; }
  if (ps.length === 1 && fromEnter) { showItem(ps[0]); input.select(); return; }
  showList(ps, q);
}

function addHistory(key, p) {
  const k = history.findIndex(h => h.key === key);
  if (k > -1) history.splice(k, 1);
  history.unshift({ key, p });
  history.length = Math.min(history.length, 6);
  $("history").hidden = false;
  $("histList").innerHTML = history.map(h => {
    const p = h.p;
    const price = !p ? "—" : isBz(p) ? fmt(p[7]) : p[5] ? fmt(p[5]) : "Caja";
    return `<li ${p ? `data-i="${reg(p)}"` : `data-q="${esc(h.key)}"`}>
      <span class="c">${esc(h.key)}</span>
      <span class="t">${p ? esc(p[2]) : "No encontrado"}</span>
      <span class="p ${p && isBz(p) ? "s" : ""}">${price}</span>
    </li>`;
  }).join("");
}

$("scanForm").addEventListener("submit", e => { e.preventDefault(); clearTimeout(t); search(input.value, true); });

let t;
input.addEventListener("input", () => {
  clearTimeout(t);
  const v = input.value.trim();
  if (/^[\d\s-]+$/.test(v)) {
    const d = v.replace(/\D/g, "");
    if (d.length >= 13) t = setTimeout(() => search(input.value, true), 250);
  } else if (v.length >= 3) {
    t = setTimeout(() => search(input.value, false), 300);
  } else if (!v) { pendingName = null; showIdle(); }
});

function pick(el) {
  if (el.dataset.i) { const p = REG[+el.dataset.i]; showItem(p); input.value = p[0] || p[1]; }
  else { input.value = el.dataset.q; search(el.dataset.q, true); }
  input.focus(); input.select();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.addEventListener("click", e => { const el = e.target.closest("[data-i],[data-q]"); if (el) pick(el); });
document.addEventListener("keydown", e => {
  const el = document.activeElement;
  if (e.key === "Enter" && el && el.matches(".matches li")) { pick(el); return; }
  if (el !== input && /^\d$/.test(e.key)) { input.value = ""; input.focus(); }
});
// Sonidos: archivos .wav publicados junto a la página (más confiables que el sintetizador del navegador)
let soundOn = true, unlocked = false;
try { soundOn = localStorage.getItem("dm-sonido") !== "off"; } catch (e) {}
const SND = { bazar: new Audio("sonido-bazar.wav"), normal: new Audio("sonido-normal.wav") };
for (const a of Object.values(SND)) { a.preload = "auto"; a.volume = 1; }
const sndBtn = $("snd");
function paintSnd() { sndBtn.setAttribute("aria-pressed", soundOn); sndBtn.textContent = soundOn ? "🔊 Sonido" : "🔇 Sin sonido"; }
paintSnd();
// El navegador solo deja sonar después de que alguien toca o teclea en la página: se "desbloquea" en el primer gesto
function unlockAudio() {
  if (unlocked) return;
  unlocked = true;
  for (const a of Object.values(SND)) {
    try {
      a.muted = true;
      const pr = a.play();
      if (pr) pr.then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; unlocked = false; });
      else { a.pause(); a.muted = false; }
    } catch (e) { a.muted = false; unlocked = false; }
  }
}
["pointerdown", "touchend", "click", "keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
function playSnd(k, force) {
  if (!soundOn && !force) return;
  const a = SND[k];
  try {
    a.muted = false;
    a.currentTime = 0;
    const pr = a.play();
    if (pr) pr.catch(() => {});
  } catch (e) {}
}
const chime = force => playSnd("bazar", force);
const softChime = () => playSnd("normal");
sndBtn.addEventListener("click", e => {
  e.stopPropagation(); soundOn = !soundOn; paintSnd();
  try { localStorage.setItem("dm-sonido", soundOn ? "on" : "off"); } catch (er) {}
  if (soundOn) chime(true);
  input.focus();
});

input.focus();
</script>
