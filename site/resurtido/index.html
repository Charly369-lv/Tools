<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Resurtido de Tiendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,900&family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Resurtido desde la Bodega Central a las tiendas.
   Flujo en 3 pasos: 1) elegir tiendas  2) revisar lo que va a cada una  3) aprobar todo junto.
   El análisis (faltantes, devoluciones, proveedores) va aparte para no estorbar la operación. */
:root {
  --navy: #112369; --navy-deep: #0b1748; --on-navy: #fff;
  --bg: #f3f4f9; --surface: #fff; --ink: #111a3d; --muted: #5b6386; --line: #d9dcea; --soft: #e9ecf6;
  --red: #c42318; --red-bg: #fde8e6; --amber: #9a6700; --amber-bg: #fff3d1; --green: #157a3d; --green-bg: #e3f4e8; --gold: #f2bd3c;
  --f-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --navy: #2a40a0; --bg: #080e26; --surface: #111a3d; --ink: #edf0fa; --muted: #9da6c9; --line: #26315e; --soft: #18224c;
    --red: #ff7a6b; --red-bg: #3a1512; --amber: #f2bd3c; --amber-bg: #3a2f10; --green: #4fd383; --green-bg: #10331f; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1100px; margin: 0 auto; }
header.mast { background: var(--navy-deep); color: var(--on-navy); padding-block: 14px; }
.mast .inner { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.mast img { display: block; width: min(180px, 46vw); height: auto; }
.mast nav { display: flex; gap: 6px; flex-wrap: wrap; }
.mast nav button { background: transparent; border: 2px solid rgba(255,255,255,.3); color: #fff; min-height: 36px; padding: 4px 12px; font-size: 14px; }
.mast nav button.on { background: #fff; color: var(--navy-deep); border-color: #fff; }
main { padding-block: 18px 120px; }
main .inner { display: grid; gap: 16px; }
main .inner > *, .card > * { min-width: 0; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(24px, 5vw, 32px); line-height: 1.1; }
h2 { margin: 0; font-size: 18px; font-weight: 800; }
h3 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.small { font-size: 12px; color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
button { font: 700 15px var(--f-body); border-radius: 10px; cursor: pointer; padding: 9px 16px; border: 2px solid var(--navy); background: var(--navy); color: var(--on-navy); min-height: 44px; }
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.ok { background: var(--green); border-color: var(--green); }
button.sm { min-height: 34px; padding: 4px 12px; font-size: 13px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, .scard:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input, select { font: 15px var(--f-body); padding: 9px 11px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); min-width: 0; max-width: 100%; }
.notice { border-radius: 10px; padding: 11px 14px; font-size: 14px; background: var(--amber-bg); }
.notice.bad { background: var(--red-bg); }
.notice.good { background: var(--green-bg); }
a { color: inherit; }

/* Pasos */
.steps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--muted); }
.steps span { display: inline-flex; align-items: center; gap: 6px; }
.steps i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--soft); color: var(--muted); font-size: 12px; }
.steps .on { color: var(--ink); }
.steps .on i { background: var(--navy); color: #fff; }
.steps .done i { background: var(--green); color: #fff; }
.steps b { color: var(--line); }

/* Tarjetas de tienda */
.stores { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.scard { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; cursor: pointer; text-align: left; }
.scard:hover { border-color: var(--navy); }
.scard.sel { border-color: var(--navy); box-shadow: 0 0 0 2px var(--navy) inset; }
.scard.hecho { cursor: default; opacity: .75; }
.scard .code { font-size: 26px; font-weight: 900; letter-spacing: .02em; line-height: 1; }
.scard .nm { font-size: 13px; color: var(--muted); }
.scard .uds { font-size: 15px; }
.scard .uds b { font-size: 22px; font-variant-numeric: tabular-nums; }
.scard .chk { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 900; color: #fff; }
.scard.sel .chk { background: var(--navy); border-color: var(--navy); }
.tag { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 8px; background: var(--soft); }
.tag.red { background: var(--red-bg); color: var(--red); }
.tag.green { background: var(--green-bg); color: var(--green); }
.tag.amber { background: var(--amber-bg); color: var(--amber); }

/* Barra fija inferior con la acción principal */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--navy-deep); color: #fff; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgba(0,0,0,.18); }
.dock .inner { display: flex; gap: 10px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dock b { font-size: 20px; }
.dock button { border-color: #fff; }
.dock button.ghost { color: #fff; border-color: rgba(255,255,255,.4); }
.dock button.prim { background: var(--gold); border-color: var(--gold); color: #1d2340; }

/* Revisión de una tienda */
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lines { display: grid; }
.ln { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.ln:last-child { border-bottom: 0; }
.ln.off .info { opacity: .45; }
.ln .t { font-weight: 700; line-height: 1.25; }
.ln .why { font-size: 13px; color: var(--muted); }
.ln .why b { color: var(--ink); }
.sw { width: 24px; height: 24px; accent-color: var(--navy); }
.step { display: inline-flex; align-items: center; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
.step button { min-height: 38px; width: 38px; padding: 0; border: 0; border-radius: 0; background: var(--soft); color: var(--ink); font-size: 20px; }
.step input { width: 52px; border: 0; border-radius: 0; text-align: center; font-weight: 800; font-size: 17px; padding: 6px 2px; -moz-appearance: textfield; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.kpi span { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpi b { font-size: 24px; font-variant-numeric: tabular-nums; }
.kpi.bad b { color: var(--red); }
details > summary { cursor: pointer; font-weight: 700; }

/* Análisis */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
.tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; border-radius: 0; min-height: 40px; padding: 6px 10px; margin-bottom: -2px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--navy); }
.tbl { overflow: auto; max-height: 65vh; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { position: sticky; top: 0; background: var(--surface); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); z-index: 1; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

/* Plan */
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--ink); min-height: 40px; }
.seg button.on { background: var(--navy); color: #fff; }
.plan { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.plan .f { display: grid; gap: 6px; font-size: 13px; font-weight: 800; color: var(--muted); align-content: start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .c { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); color: var(--ink); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; font-weight: 700; }
.chips .c button { min-height: 24px; width: 24px; padding: 0; border-radius: 50%; border: 0; background: var(--line); color: var(--ink); font-size: 14px; }
.chips .q { min-height: 32px; padding: 2px 12px; font-size: 13px; background: transparent; color: var(--ink); border-color: var(--line); }
.chips .q.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.pick { position: relative; }
.pick input { width: 100%; }
.pick .lst { position: absolute; z-index: 30; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; max-height: 260px; overflow: auto; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.pick .lst button { display: block; width: 100%; text-align: left; background: transparent; color: var(--ink); border: 0; border-radius: 0; min-height: 38px; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--line); }
.pick .lst button:hover, .pick .lst button:focus-visible { background: var(--soft); }
.bar2 { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; margin-top: 4px; min-width: 60px; }
.bar2 i { display: block; height: 100%; background: var(--green); }
.bar2 i.low { background: var(--red); }
dialog { border: 0; border-radius: 14px; padding: 0; max-width: min(540px, calc(100vw - 32px)); width: 100%; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(5, 10, 30, .55); }
dialog form { padding: 18px 20px; display: grid; gap: 12px; }
@media (max-width: 640px) { .hide-m { display: none; } .ln { grid-template-columns: auto minmax(0, 1fr); } .ln .step { grid-column: 2; justify-self: start; } }
</style>
</head>
<body>
<header class="mast pad"><div class="inner"><img src="../checador/logo.png" alt="De Museo"><nav id="nav" hidden>
  <button type="button" data-v="inicio">Resurtir</button><button type="button" data-v="analisis">Análisis</button></nav></div></header>
<main class="pad"><div class="inner" id="app">
  <section class="card" id="claveCard">
    <h1>Resurtido de tiendas</h1>
    <p class="muted">Qué mandar de la Bodega Central a cada tienda, calculado cada noche con lo que vende cada una. Escribe la clave para abrir los datos.</p>
    <form id="claveForm" class="row" autocomplete="off"><input type="password" id="clave" placeholder="Clave" autocomplete="off"><button type="submit">Abrir</button></form>
    <p class="notice bad" id="claveErr" hidden></p>
  </section>
</div></main>
<div class="dock pad" id="dock" hidden><div class="inner" id="dockIn"></div></div>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmt = n => Number(n || 0).toLocaleString("es-GT");
const app = $("app");
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// Nombres claros en lugar de A, B, C
const CLASE = { A: ["Más vendido", "green"], B: ["Se vende", "amber"], C: ["Ocasional", ""] };

let D = null, VIEW = "inicio", T = null, ATAB = "fal", FIL = "";
let SEL = new Set();   // tiendas marcadas para resurtir hoy
// Plan: automático (por clase de venta) o personalizado (días a cubrir + proveedores/categorías)
let PLAN = lsGet("resurtido-plan", { modo: "auto", dias: 15, provs: [], cats: [], nombre: "" });
let CALC = null;   // resultado del plan personalizado (se recalcula cuando cambia)
// El plan se guarda con nombres (los números internos cambian cada noche)
function planDesdeNombres(g) {
  return { modo: g.modo || "auto", dias: Math.max(1, +g.dias || 15), nombre: g.nombre || "",
    provs: (g.provs || []).map(n => D.prov.indexOf(n)).filter(i => i >= 0), cats: (g.cats || []).map(n => D.cat.indexOf(n)).filter(i => i >= 0) };
}
const planANombres = (pl, nombre) => ({ modo: pl.modo, dias: pl.dias, nombre: nombre ?? pl.nombre ?? "", provs: pl.provs.map(i => D.prov[i]), cats: pl.cats.map(i => D.cat[i]) });
function cambiarPlan(cambios) { Object.assign(PLAN, cambios); CALC = null; lsSet("resurtido-plan", planANombres(PLAN)); pintarInicio(); }
const planesGuardados = () => lsGet("resurtido-planes", []);
function resumenPlan() {
  if (PLAN.modo === "auto") return "Automático: más vendidos para " + D.cfg.semanas_A + " semanas, los que se venden para " + D.cfg.semanas_B + " y los ocasionales se reponen.";
  const q = [PLAN.provs.length ? PLAN.provs.map(i => D.prov[i]).join(", ") : "", PLAN.cats.length ? PLAN.cats.map(catNom).join(", ") : ""].filter(Boolean).join(" · ");
  return `Surtir <b>${PLAN.dias} días</b> de venta de ${q ? esc(q) : "todo el catálogo"}.`;
}
function selector(idQ, idL, items, elegir) {
  const q = $(idQ), L = $(idL); if (!q) return;
  const mostrar = () => {
    const w = norm(q.value).split(/\s+/).filter(Boolean);
    const r = items.filter(x => w.every(p => x.z.includes(p))).slice(0, 40);
    L.innerHTML = r.map(x => `<button type="button" data-i="${x.i}">${esc(x.label)}${x.sub ? `<div class="small">${esc(x.sub)}</div>` : ""}</button>`).join("") || '<p class="small" style="padding:10px">Sin resultados</p>';
    L.hidden = false;
    L.querySelectorAll("[data-i]").forEach(b => b.onclick = () => elegir(+b.dataset.i));
  };
  q.onfocus = mostrar; q.oninput = mostrar;
  q.onkeydown = e => { if (e.key === "Escape") { L.hidden = true; q.blur(); } if (e.key === "Enter") { e.preventDefault(); const b = L.querySelector("[data-i]"); if (b) b.click(); } };
  document.addEventListener("pointerdown", e => { if (!e.target.closest(".pick")) L.hidden = true; }, { once: true });
}

// ---------------------------------------------------------------- abrir datos
async function descifrar(sobre, clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(sobre.s), iterations: sobre.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let plano;
  try { plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sobre.iv) }, key, b64(sobre.d)); } catch (e) { throw new Error("clave"); }
  return JSON.parse(await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
async function abrir(clave, silencioso) {
  $("claveErr").hidden = true;
  try {
    const r = await fetch("resurtido.enc?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("falta");
    D = await descifrar(await r.json(), clave);
    try { localStorage.setItem("surtido-clave", clave); } catch (e) {}   // misma clave que el checador
    limpiarViejos();
    SEL = new Set(lsGet(selKey(), null) || hoyTocan());
    PLAN = planDesdeNombres(lsGet("resurtido-plan", null) || { modo: "auto", dias: 15, provs: [], cats: [] });
    $("nav").hidden = false;
    ir("inicio");
  } catch (e) {
    if (silencioso) { lsDel("surtido-clave"); return; }
    $("claveErr").textContent = e.message === "clave" ? "Clave incorrecta." : e.message === "falta" ? "Todavía no se ha calculado el resurtido. Corre la sincronización en GitHub." : "No se pudieron abrir los datos en este navegador.";
    $("claveErr").hidden = false;
  }
}
$("claveForm").onsubmit = e => { e.preventDefault(); const c = $("clave").value.trim(); if (c) abrir(c); };
(() => { let c = null; try { c = localStorage.getItem("surtido-clave"); } catch (e) {} if (c) { try { c = JSON.parse(c); } catch (e) {} abrir(String(c), true); } })();
$("nav").querySelectorAll("[data-v]").forEach(b => b.onclick = () => ir(b.dataset.v));

// ---------------------------------------------------------------- estado guardado en este equipo (por cálculo)
const sigPlan = () => PLAN.modo === "auto" ? "auto" : "p" + PLAN.dias + "-" + [...PLAN.provs].sort().join(".") + "-" + [...PLAN.cats].sort().join(".");
const selKey = () => "resurtido-sel-" + D.v, aprKey = () => "resurtido-apr-" + D.v, edKey = t => `resurtido-ed-${t}-${sigPlan()}-${D.v}`;
const catNom = i => { const c = String(D.cat[i] || ""); return c.split("/").map(x => x.trim().replace(/^\d+\s+/, "")).slice(-2).join(" / "); };
// ¿El producto entra en el plan? (proveedor o categoría; la categoría incluye sus subcategorías)
function entra(pid) {
  if (PLAN.modo === "auto") return true;
  const p = P(pid);
  if (PLAN.provs.length && !PLAN.provs.includes(p[3])) return false;
  if (PLAN.cats.length) { const c = String(D.cat[p[6]] || ""); if (!PLAN.cats.some(i => { const k = String(D.cat[i]); return c === k || c.startsWith(k + " /"); })) return false; }
  return true;
}
const ritmoDia = r => (0.5 * r[1] + 0.3 * r[2] + 0.2 * r[3]) / 28;   // r = [pid, sem 1-4, sem 5-8, sem 9-12, tiene, en camino]
// Plan personalizado: objetivo = venta diaria × días; la bodega se reparte a la tienda con menos días de cobertura
function calcular() {
  const sig = sigPlan(); if (CALC && CALC.sig === sig) return CALC;
  const nec = new Map(), out = {};
  for (const t of D.tiendas) {
    out[t] = [];
    for (const r of D.s[t].v) {
      if (!entra(r[0])) continue;
      const rd = ritmoDia(r), n = Math.ceil(rd * PLAN.dias - 1e-9) - r[4] - r[5];
      if (n > 0) { const a = nec.get(r[0]) || []; a.push({ t, r, rd, n, asg: 0 }); nec.set(r[0], a); }
    }
  }
  for (const [pid, arr] of nec) {
    let disp = P(pid)[7] || 0;
    while (disp > 0) {
      let m = null, mc = Infinity;
      for (const y of arr) { if (y.asg >= y.n) continue; const c = (y.r[4] + y.r[5] + y.asg) / Math.max(y.rd, 0.005); if (c < mc) { mc = c; m = y; } }
      if (!m) break; m.asg++; disp--;
    }
    for (const y of arr) out[y.t].push([pid, "", y.r[1], y.r[1] + y.r[2] + y.r[3], y.r[4], y.r[5], P(pid)[7] || 0, y.asg, y.n, y.asg >= y.n ? 0 : y.asg ? 1 : 2]);
  }
  for (const t of D.tiendas) out[t].sort((a, b) => b[3] - a[3]);
  return (CALC = { sig, l: out });
}
const lineasBase = t => PLAN.modo === "auto" ? D.s[t].l : calcular().l[t];
function limpiarViejos() {
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && /^resurtido-(ed|sel|apr)-/.test(k) && !k.endsWith(D.v)) localStorage.removeItem(k); } } catch (e) {}
}
const DIAS = ["dom", "lun", "mar", "mie", "jue", "vie", "sab"];

  if ($("dSig")) $("dSig").onclick = () => { FIL = ""; ir("tienda", sig); };
  if ($("dVolver")) $("dVolver").onclick = () => ir("inicio");
  if ($("dApr")) $("dApr").onclick = () => aprobar(i >= 0 ? sel : [t]);
}

// ---------------------------------------------------------------- análisis (aparte de la operación)
function pintarAnalisis() {
  dock("");
  const tiendaSel = T && D.tiendas.includes(T) ? T : D.tiendas[0]; T = tiendaSel;
  const s = D.s[T];
  const tabs = [["fal", "No hay en bodega"], ["dev", "Para devolver"], ["prov", "Proveedores"], ["res", "Resumen por tienda"]];
  let cuerpo = "";
  const prodTd = pid => { const p = P(pid); return `<td><b>${esc(p[2])}</b><div class="small"><span class="mono">${esc(p[1] || p[0])}</span> · ${esc(prov(pid))}</div></td>`; };
  if (ATAB === "fal") {
    // Consolidado: lo que se vende en las tiendas y no hay en bodega (para compras)
    const m = new Map();
    for (const t of D.tiendas) for (const x of lineasBase(t)) if (x[9] === 2) { const y = m.get(x[0]) || { pid: x[0], n: 0, v: 0, ts: [], A: 0 }; y.n += x[8]; y.v += x[3]; y.ts.push(t); if (x[1] === "A") y.A++; m.set(x[0], y); }
    const arr = [...m.values()].sort((a, b) => b.A - a.A || b.v - a.v);
    cuerpo = `<p class="muted">Se venden en las tiendas y ya no hay en la Bodega Central. Es la lista para <b>compras</b> (o para pedir traslados entre tiendas).</p>
      <div class="tbl"><table><thead><tr><th>Producto</th><th class="n">Más vendido en</th><th class="n">Vendido 12 sem.</th><th class="n">Necesitan</th><th class="hide-m">Tiendas</th></tr></thead><tbody>
      ${arr.slice(0, 800).map(y => `<tr>${prodTd(y.pid)}<td class="n">${y.A}</td><td class="n">${fmt(y.v)}</td><td class="n">${fmt(y.n)}</td><td class="small hide-m">${y.ts.join(", ")}</td></tr>`).join("") || '<tr><td colspan="5" class="muted">Nada.</td></tr>'}</tbody></table></div>`;
  } else if (ATAB === "dev") {
    cuerpo = `<div class="row"><label class="small" style="font-weight:700">Tienda <select id="aT">${D.tiendas.map(t => `<option ${t === T ? "selected" : ""}>${t}</option>`).join("")}</select></label></div>
      <p class="muted">Lo que ${esc(T)} tiene sin ninguna venta en 12 semanas (y con más de 90 días en el sistema). Revisa si está en piso, si conviene moverlo a otra tienda o devolverlo al CEDIS.</p>
      <div class="tbl"><table><thead><tr><th>Producto</th><th class="n">Tiene</th><th class="hide-m">Se vende en</th></tr></thead><tbody>
      ${s.d.slice(0, 500).map(x => `<tr>${prodTd(x[0])}<td class="n">${x[1]}</td><td class="small hide-m">${esc(D.tiendas.filter(t => t !== T && D.s[t].l.some(y => y[0] === x[0])).join(", ") || "—")}</td></tr>`).join("") || '<tr><td colspan="3" class="muted">Nada.</td></tr>'}</tbody></table></div>`;
  } else if (ATAB === "prov") {
    cuerpo = `<p class="muted">Toda la cadena, últimas 12 semanas, ordenado por venta. <b>% vendido</b> = vendido ÷ (vendido + lo que hay en tiendas). <b>Le alcanza</b> = semanas que dura lo que hay en tiendas al ritmo actual: más de 12 es exceso, menos de 3 hace falta mandar.</p>
      <div class="tbl"><table><thead><tr><th>Proveedor / editorial</th><th class="n">Unidades</th><th class="n">Venta</th><th class="n hide-m">En tiendas</th><th class="n hide-m">En bodega</th><th class="n">% vendido</th><th class="n">Le alcanza</th></tr></thead><tbody>
      ${D.pr.slice(0, 300).map(([i, u, q, ext, exb]) => { const st = u + ext ? Math.round(u / (u + ext) * 100) : 0, c = u ? ext / (u / 12) : null;
        return `<tr><td><b>${esc(D.prov[i])}</b></td><td class="n">${fmt(u)}</td><td class="n">Q${fmt(q)}</td><td class="n hide-m">${fmt(ext)}</td><td class="n hide-m">${fmt(exb)}</td><td class="n">${st}%</td>
          <td class="n">${c == null ? "—" : `<span class="tag ${c > 12 ? "amber" : c < 3 ? "red" : "green"}">${c > 99 ? "+99" : c.toFixed(1)} sem.</span>`}</td></tr>`; }).join("")}</tbody></table></div>`;
  } else {
    cuerpo = `<div class="tbl"><table><thead><tr><th>Tienda</th><th class="n">Unidades sugeridas</th><th class="n">Agotados urgentes</th><th class="n">Más vendidos agotados</th><th class="n hide-m">No hay en bodega</th><th class="n hide-m">Para devolver</th></tr></thead><tbody>
      ${D.tiendas.map(t => { const s2 = D.s[t]; return `<tr><td><b>${esc(t)}</b> <span class="small">${esc(D.nombres[t] || "")}</span></td><td class="n">${fmt(tot(t).u)}</td><td class="n">${urgentes(t)}</td><td class="n">${s2.agA} de ${s2.nA}</td><td class="n hide-m">${s2.l.filter(x => x[9] === 2).length}</td><td class="n hide-m">${fmt(s2.d.reduce((a, x) => a + x[1], 0))}</td></tr>`; }).join("")}</tbody></table></div>`;
  }
  app.innerHTML = `<section class="card"><div class="row between"><h1>Análisis</h1><button type="button" class="ghost sm" id="aXls">Excel completo</button></div>
    <div class="tabs" role="tablist">${tabs.map(([k, n]) => `<button type="button" role="tab" data-at="${k}" class="${ATAB === k ? "on" : ""}">${n}</button>`).join("")}</div>${cuerpo}</section>`;
  app.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { ATAB = b.dataset.at; pintarAnalisis(); });
  if ($("aT")) $("aT").onchange = e => { T = e.target.value; pintarAnalisis(); };
  $("aXls").onclick = () => excel(D.tiendas, true);
}

// ---------------------------------------------------------------- Excel
function excel(tiendas, todo) {
  const wb = XLSX.utils.book_new();
  const fp = pid => { const p = P(pid); return { "Código": p[0], "Referencia": p[1], "Producto": p[2], "Proveedor": prov(pid), "Precio": p[4] }; };
  const add = (n, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ "": "Sin datos" }]), n.slice(0, 31));
  const filas = [];
  for (const t of tiendas) for (const l of lineas(t)) if (l.on && l.q > 0) filas.push(Object.assign({ "Tienda": t }, fp(l.pid), { "Tipo": l.tipo === "urg" ? "Urgente" : l.tipo === "rep" ? "Reponer" : "Probar", "Mandar": l.q }));
  add("Pedido", filas);
  if (todo) {
    add("Proveedores", D.pr.map(([i, u, q, ext, exb, np]) => ({ "Proveedor": D.prov[i], "Unidades 12 sem.": u, "Venta Q": q, "En tiendas": ext, "En bodega": exb, "% vendido": u + ext ? Math.round(u / (u + ext) * 100) : 0, "Productos vendidos": np })));
    const fal = []; for (const t of D.tiendas) for (const x of lineasBase(t)) if (x[9] === 2) fal.push(Object.assign({ "Tienda": t }, fp(x[0]), { "Clase": x[1] ? CLASE[x[1]][0] : "", "Vendió 12 sem.": x[3], "Tiene": x[4], "Necesita": x[8] }));
    add("No hay en bodega", fal);
    const dev = []; for (const t of D.tiendas) for (const x of D.s[t].d) dev.push(Object.assign({ "Tienda": t }, fp(x[0]), { "Tiene": x[1] }));
    add("Para devolver", dev);
  }
  XLSX.writeFile(wb, `Resurtido_${tiendas.length === 1 ? tiendas[0] : "tiendas"}_${D.v.slice(0, 10)}.xlsx`);
}

// ---------------------------------------------------------------- paso 3: aprobar (crea los pedidos con el servidor de Despachos)
const CFG = () => lsGet("despacho-cfg", null), OP = () => lsGet("despacho-op", null);
async function api(accion, datos, op) {
  const c = CFG();
  const body = JSON.stringify(Object.assign({ accion, token: c.token, operador: op }, datos || {}));
  let r;
  try { r = await fetch(c.url + (c.url.includes("?") ? "&" : "?") + "q=" + encodeURIComponent(body), { method: "GET", redirect: "follow" }); }
  catch (e) { throw new Error("No hay conexión con el servidor. Revisa el internet."); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "Error del servidor");
  return j.datos;
}
function dialogo(html) { $("dlgForm").innerHTML = html; const d = $("dlg"); try { d.showModal(); } catch (e) { d.setAttribute("open", ""); } return d; }
async function enviarPedido(t, ls, cod, estado) {
  const partes = []; for (let i = 0; i < ls.length; i += 120) partes.push(ls.slice(i, i + 120).map(l => [l.pid, l.q]));
  let pedido = 0;
  for (let i = 0; i < partes.length; i++) {
    estado(`${t}: enviando ${partes.length > 1 ? `parte ${i + 1} de ${partes.length}` : "pedido"}…`);
    const r = await api("resurtido", pedido ? { pedido, lineas: partes[i], tienda: t } : { tienda: t, borrador: D.bor[t] ? D.bor[t].id : 0, lineas: partes[i], plan: PLAN.modo === "auto" ? "" : (PLAN.nombre || `${PLAN.dias} días ${PLAN.provs.map(i => D.prov[i]).concat(PLAN.cats.map(catNom)).join(", ")}`).slice(0, 60) }, cod);
    pedido = r.pedido;
  }
  estado(`${t}: confirmando…`);
  return (await api("resurtido", { pedido, fin: true, tienda: t }, cod)).nombre;
}
function aprobar(tiendas) {
  if (!CFG()) {
    dialogo(`<h2>Falta conectar el servidor</h2><p class="muted">Los pedidos se crean con el mismo servidor de Despachos. Abre <a href="../despacho/">Despachos</a> en este equipo, configúralo una vez y regresa.</p><div class="row" style="justify-content:flex-end"><button type="submit">Entendido</button></div>`);
    return;
  }
  const apr = aprobados();
  const plan = tiendas.filter(t => !apr[t]).map(t => ({ t, ls: lineas(t).filter(l => l.on && l.q > 0) })).filter(x => x.ls.length);
  if (!plan.length) return;
  const total = plan.reduce((s, x) => s + x.ls.reduce((a, l) => a + l.q, 0), 0), op = OP();
  const d = dialogo(`${pasos(3)}<h2>Aprobar ${plan.length === 1 ? "el pedido de " + esc(plan[0].t) : plan.length + " pedidos"}</h2>
    <div class="tbl" style="max-height:34vh"><table><tbody>${plan.map(x => `<tr><td><b>${esc(x.t)}</b></td><td class="n">${fmt(x.ls.length)} productos</td><td class="n"><b>${fmt(x.ls.reduce((a, l) => a + l.q, 0))}</b> uds.</td></tr>`).join("")}
      <tr><td><b>Total</b></td><td></td><td class="n"><b>${fmt(total)}</b> uds.</td></tr></tbody></table></div>
    <p class="muted">Se crea un pedido por tienda y aparecen en Despachos. ${plan.length > 1 ? "Ahí el CEDIS los recoge todos juntos con <b>Surtir varias tiendas</b> y luego reparte por tienda." : ""}</p>
    <label class="small" style="font-weight:700;display:grid;gap:4px">Tu código de supervisor<input id="opCod" value="${esc(op && op.rol === "SUPERVISOR" ? op.codigo : "")}" autocomplete="off" style="text-transform:uppercase"></label>
    <p class="notice bad" id="apErr" hidden></p><p class="small" id="apEst"></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="ghost" id="apNo">Cancelar</button><button type="submit" class="ok" id="apSi">Aprobar ${fmt(total)} unidades</button></div>`);
  $("apNo").onclick = () => d.close();
  setTimeout(() => $("opCod").focus(), 50);
  $("dlgForm").onsubmit = async e => {
    e.preventDefault();
    const cod = $("opCod").value.trim().toUpperCase(); if (!cod) return;
    $("apSi").disabled = true; $("apErr").hidden = true;
    try { const yo = await api("login", { codigo: cod }, cod); if (yo.rol !== "SUPERVISOR") throw new Error("Solo un supervisor puede aprobar pedidos."); }
    catch (er) { $("apErr").textContent = er.message; $("apErr").hidden = false; $("apSi").disabled = false; return; }
    const hechos = [], fallos = [];
    for (const x of plan) {
      try {
        const nombre = await enviarPedido(x.t, x.ls, cod, m => $("apEst").textContent = m);
        hechos.push({ t: x.t, nombre, u: x.ls.reduce((a, l) => a + l.q, 0) });
        const a = aprobados(); a[x.t] = nombre; lsSet(aprKey(), a);
        lsDel(edKey(x.t)); delete D.bor[x.t]; SEL.delete(x.t); guardarSel();
      } catch (er) { fallos.push(`${x.t}: ${er.message}`); }
    }
    d.close();
    dialogo(`<h2>${hechos.length ? "Listo ✓" : "No se pudo crear"}</h2>
      ${hechos.length ? `<div class="tbl"><table><tbody>${hechos.map(h => `<tr><td><b>${esc(h.t)}</b></td><td class="mono">${esc(h.nombre)}</td><td class="n">${fmt(h.u)} uds.</td></tr>`).join("")}</tbody></table></div>
        <p class="muted">Ya están en Despachos para empacar${hechos.length > 1 ? " (usa <b>Surtir varias tiendas a la vez</b>)" : ""}. Mañana el cálculo los cuenta como "en camino".</p>` : ""}
      ${fallos.length ? `<p class="notice bad">${fallos.map(esc).join("<br>")}</p>` : ""}
      <div class="row" style="justify-content:flex-end"><button type="submit">Volver a las tiendas</button></div>`);
    $("dlgForm").onsubmit = ev => { ev.preventDefault(); $("dlg").close(); ir("inicio"); };
  };
}
</script>
