name: Diagnóstico de almacenes y productos

on:
  # Botón "Run workflow". Solo lee la configuración; no cambia nada.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    env:
      ODOO_URL: ${{ secrets.ODOO_URL }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      ODOO_USER: ${{ secrets.ODOO_USER }}
      ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer configuración de almacenes
        run: python sync/diagnostico_almacen.py --origen BOD
      - name: Leer la pestaña Metadata de los productos
        if: always()
        run: python sync/diagnostico_metadata.py
