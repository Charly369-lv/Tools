name: Actualizar datos

on:
  # Todos los días a las 2:00 a. m. de Guatemala (8:00 UTC)
  schedule:
    - cron: "0 8 * * *"
  # Botón "Run workflow" para actualizar en cualquier momento
  workflow_dispatch:
  # También al subir cambios a las apps
  push:
    branches: [main]
    paths: ["site/**", "sync/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar1.outputs.page_url || steps.publicar2.outputs.page_url || steps.publicar3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python sync/sync_odoo.py --out site

      # Existencias por bodega para la app de surtido, cifradas con la clave CLAVE_EXISTENCIAS.
      # Si falla o no está la clave, lo demás se publica igual.
      - name: Existencias protegidas
        continue-on-error: true
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          CLAVE_EXISTENCIAS: ${{ secrets.CLAVE_EXISTENCIAS }}
        run: |
          pip install --quiet cryptography
          python sync/existencias.py --out site

      # Resurtido automático BOD → tiendas (cifrado). Si falla, lo demás se publica igual.
      - name: Resurtido de tiendas
        continue-on-error: true
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          CLAVE_EXISTENCIAS: ${{ secrets.CLAVE_EXISTENCIAS }}
        run: python sync/resurtido.py --out site

      # Candidatos para el surtido de Fitness One (cifrado). Si falla, lo demás se publica igual.
      - name: Mayoreo Fitness One
        continue-on-error: true
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          CLAVE_EXISTENCIAS: ${{ secrets.CLAVE_EXISTENCIAS }}
        run: python sync/fitness_one.py --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      # A veces GitHub tarda unos segundos en registrar el paquete recién subido ("Found 0 artifacts").
      # Se intenta publicar hasta 3 veces, esperando entre intentos.
      - name: Publicar en GitHub Pages
        id: publicar1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar y reintentar (2.º intento)
        if: steps.publicar1.outcome == 'failure'
        run: sleep 45

      - name: Publicar en GitHub Pages (2.º intento)
        id: publicar2
        if: steps.publicar1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar y reintentar (3.er intento)
        if: steps.publicar1.outcome == 'failure' && steps.publicar2.outcome == 'failure'
        run: sleep 90

      - name: Publicar en GitHub Pages (3.er intento)
        id: publicar3
        if: steps.publicar1.outcome == 'failure' && steps.publicar2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub apaga las tareas programadas si el repositorio pasa 60 días sin cambios.
      # Este paso guarda la fecha de la última sincronización para mantenerlo activo.
      - name: Registrar sincronización
        run: |
          cp site/ultima-sincronizacion.json sync/ultima-sincronizacion.json
          git config user.name "Actualizador"
          git config user.email "actions@users.noreply.github.com"
          git add sync/ultima-sincronizacion.json
          git commit -m "Actualización de datos" || echo "Sin cambios"
          git push || echo "No se pudo registrar (no afecta la publicación)"
